<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KURO · Redirecting...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1b2352 0%, #283871 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }

        /* Simple Clean Container */
        .redirect-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* Logos - Simple Side by Side, No Filters */
        .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .logos img {
            height: 65px;
            width: auto;
        }

        /* Clean Spinner */
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Simple Text */
        h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .redirect-link {
            margin-top: 1.5rem;
        }

        .redirect-link a {
            color: #D4AF37;
            text-decoration: none;
            font-size: 0.75rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .redirect-link a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
    <script>
        setTimeout(function() {
            window.location.href = "login.html";
        }, 1800);
    </script>
</head>
<body>
    <div class="redirect-container">
        <!-- Simple Logos - Normal Display -->
        <div class="logos">
            <img src="xu_logo.png" alt="Xavier University">
            <img src="kuro_logo.png" alt="KURO">
        </div>

        <!-- Clean Spinner -->
        <div class="spinner"></div>

        <!-- Text -->
        <h1>KURO</h1>
        <div class="subtitle">Kinaadman University Research Office</div>

        <!-- Manual Link -->
        <div class="redirect-link">
            <a href="login.html">Continue to Login →</a>
        </div>
    </div>
</body>
</html>
