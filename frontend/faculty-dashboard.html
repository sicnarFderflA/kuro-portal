<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="autocomplete" content="off">
    <title>KURO · Faculty Dashboard | Xavier University - Ateneo de Cagayan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="api.js"></script>
    <style>
        :root {
            --xavier-primary: #0B2B4F;
            --xavier-primary-dark: #071E38;
            --xavier-gold: #C9A03D;
            --xavier-gold-light: #E1C27B;
            --xavier-gold-dark: #A87D2A;
            --xavier-gray-text: #5A6E6B;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --info: #3B82F6;
            --light-bg: #F8FAFE;
            --border-light: #E9EDF2;
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --radius-card: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F4F7FC; }

        /* ========== HEADER STYLES ========== */
        .top-nav {
            background: var(--xavier-primary);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--xavier-gold);
            flex-wrap: wrap;
            gap: 1rem;
        }
        .right-controls { display: flex; align-items: center; gap: 1.5rem; }
        .logo-area { display: flex; align-items: center; gap: 1rem; }
        .school-logo-header { height: 45px; width: auto; }
        .logo-area h2 { color: white; display: flex; align-items: center; gap: 0.5rem; font-size: 1.3rem; }
        .logo-area h2 i { color: var(--xavier-gold); }

        .user-section {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 40px;
            transition: background 0.2s;
        }
        .user-section:hover { background: rgba(255,255,255,0.1); }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            overflow: hidden;
            flex-shrink: 0;
        }
        .user-avatar.has-initial {
            background: linear-gradient(135deg, var(--xavier-gold) 0%, var(--xavier-gold-dark) 100%);
            color: var(--xavier-primary);
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-avatar .avatar-initial {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .user-name-short { font-size: 0.9rem; font-weight: 500; color: white; }
        .user-hover-card {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.75rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 0.75rem 1rem;
            min-width: 200px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            pointer-events: none;
        }
        .user-section:hover .user-hover-card {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .user-hover-card::before {
            content: '';
            position: absolute;
            top: -6px;
            right: 20px;
            width: 12px;
            height: 12px;
            background: white;
            transform: rotate(45deg);
            box-shadow: -2px -2px 5px rgba(0,0,0,0.05);
        }
        .user-full-name { font-weight: 600; color: var(--xavier-primary); font-size: 0.85rem; margin-bottom: 0.25rem; }
        .user-full-email { font-size: 0.7rem; color: #666; word-break: break-all; }
        .user-hover-card hr { margin: 0.5rem 0; border: none; border-top: 1px solid #eef2f0; }
        .user-hover-role { font-size: 0.65rem; color: var(--xavier-gold); font-weight: 600; }

        .switch-reviewer-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid var(--xavier-gold);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .switch-reviewer-btn.active {
            background: var(--xavier-gold);
            color: var(--xavier-primary);
        }
        .switch-reviewer-btn:hover {
            background: var(--xavier-gold);
            color: var(--xavier-primary);
        }
        .switch-reviewer-btn.hidden { display: none; }

        .notification-wrapper { position: relative; }
        .notification-bell {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.3rem;
            border-radius: 50%;
        }
        .notification-bell:hover { background: rgba(255,255,255,0.1); }
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: #e74c3c;
            color: white;
            font-size: 0.6rem;
            border-radius: 50%;
            padding: 2px 6px;
            min-width: 18px;
            text-align: center;
            display: none;
        }
        .notification-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            width: 380px;
            max-height: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 1000;
            overflow: hidden;
            animation: slideDown 0.2s ease;
        }
        .notification-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #eef2f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .notification-item.unread { background: #fffef5; border-left: 3px solid #D4AF37; }
        .notification-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .notification-content { flex: 1; }
        .notification-title { font-weight: 600; font-size: 0.8rem; color: #1A2E3F; margin-bottom: 0.2rem; }
        .notification-message { font-size: 0.7rem; color: #666; margin-bottom: 0.2rem; }
        .notification-time { font-size: 0.6rem; color: #999; }

        .logout-nav {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logout-nav:hover { background: rgba(231, 76, 60, 0.8); }

        /* ========== MODERN DASHBOARD STYLES ========== */
        .main-content {
            padding: 2rem;
            max-width: 1200px;
            margin: 1.5rem auto;
            background: transparent;
            border-radius: 0;
            box-shadow: none;
        }

        .welcome-header { margin-bottom: 2rem; }
        .greeting {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--xavier-primary) 0%, var(--xavier-gold-dark) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .role-chip {
            display: inline-block;
            background: var(--xavier-gold-light);
            color: var(--xavier-primary-dark);
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card-new {
            background: white;
            border-radius: var(--radius-card);
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .stat-card-new:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--xavier-gold-light);
        }
        .stat-left h3 {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5B6E8C;
            margin-bottom: 0.5rem;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--xavier-primary);
            line-height: 1.1;
        }
        .stat-trend {
            font-size: 0.65rem;
            margin-top: 0.3rem;
            color: #5B6E8C;
        }
        .stat-icon-new {
            width: 48px;
            height: 48px;
            background: rgba(201, 160, 61, 0.12);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--xavier-gold);
        }

        .section-header-modern {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .section-header-modern h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--xavier-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary-modern {
            background: var(--xavier-gold);
            color: var(--xavier-primary);
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary-modern:hover {
            background: var(--xavier-gold-dark);
            color: white;
        }

        .filter-bar-faculty {
            background: white;
            border-radius: 60px;
            padding: 0.5rem 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }
        .filter-badge {
            background: #F1F5F9;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
        }
        .filter-badge i { color: var(--xavier-gold); }
        .filter-badge select {
            background: transparent;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            outline: none;
        }
        .search-wrapper-faculty {
            flex: 1;
            display: flex;
            align-items: center;
            background: #F8FAFE;
            border-radius: 40px;
            padding: 0.3rem 1rem;
            border: 1px solid var(--border-light);
        }
        .search-wrapper-faculty i { color: #94a3b8; }
        .search-wrapper-faculty input {
            border: none;
            background: transparent;
            padding: 0.5rem;
            width: 100%;
            outline: none;
            font-size: 0.8rem;
        }

        .applications-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-top: 0;
        }
        .application-card {
            background: white;
            border-radius: var(--radius-card);
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
        }
        .application-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--xavier-gold-light);
        }
        .application-card.returned { border-left: 4px solid var(--danger); background: #fff5f5; }
        .application-card.draft { border-left: 4px solid var(--warning); background: #fefcf5; }

        .card-header-modern {
            background: linear-gradient(135deg, var(--xavier-primary) 0%, var(--xavier-primary-dark) 100%);
            padding: 0.75rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .grant-badge {
            background: rgba(212, 175, 55, 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--xavier-gold);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .status-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .status-badge.application-approved { background: var(--success); color: white; }
        .status-badge.application-awaiting { background: var(--warning); color: white; }
        .status-badge.application-review { background: var(--info); color: white; }
        .status-badge.application-draft { background: #6c757d; color: white; }
        .status-badge.application-returned { background: var(--danger); color: white; }
        .status-badge.cv-eligible { background: #d4edda; color: #155724; }
        .status-badge.cv-pending { background: #fff3cd; color: #856404; }
        .status-badge.cv-ineligible { background: #f8d7da; color: #721c24; }
        .status-badge.cv-missing { background: #e8e8e8; color: #666; }
        .status-badge.signature-sent { background: #e3ecff; color: #2c5f9a; }
        .status-badge.signature-pending { background: #fff0db; color: #b45f1b; }

        .card-body-modern { padding: 1.25rem; }
        .project-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--xavier-primary);
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }
        .info-grid-modern {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .info-item-modern {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #555;
        }
        .info-item-modern i {
            width: 18px;
            color: var(--xavier-gold);
            font-size: 0.75rem;
        }

        .cv-progress-section {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-light);
        }
        .cv-progress-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--xavier-primary);
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .cv-progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 4px;
            overflow: hidden;
            margin: 0.3rem 0;
        }
        .cv-progress-fill { height: 100%; border-radius: 10px; transition: width 0.3s; }
        .cv-progress-fill.good { background: var(--success); }
        .cv-progress-fill.warning { background: var(--warning); }
        .cv-progress-fill.bad { background: var(--danger); }
        .cv-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.65rem;
            margin-top: 0.3rem;
        }
        .cv-stat.eligible { color: var(--success); }
        .cv-stat.pending { color: var(--warning); }
        .cv-stat.ineligible { color: var(--danger); }
        .cv-stat.missing { color: #999; }

        .feedback-section {
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: #fff3cd;
            border-radius: 0.5rem;
            border-left: 3px solid #e74c3c;
        }
        .feedback-section h4 { font-size: 0.7rem; font-weight: 700; color: #856404; margin-bottom: 0.3rem; }
        .feedback-section p { font-size: 0.7rem; color: #856404; margin: 0; }

        .card-actions-modern {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-top: 1px solid var(--border-light);
            background: #fafbfc;
            flex-wrap: wrap;
        }
        .card-action-btn {
            background: #f0f2f5;
            border: none;
            padding: 0.35rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .card-action-btn:hover { background: var(--xavier-primary); color: white; }
        .card-action-btn.warning { background: var(--xavier-gold); color: var(--xavier-primary); }
        .card-action-btn.warning:hover { background: var(--xavier-gold-dark); color: white; }
        .card-action-btn.danger:hover { background: #e74c3c; color: white; }

        .empty-state-modern {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: var(--radius-card);
            border: 1px solid var(--border-light);
            color: #999;
        }
        .empty-state-modern i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

        .demo-note {
            margin-top: 1.5rem;
            padding: 0.8rem 1rem;
            background: #EFF6FF;
            border-radius: 12px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--xavier-primary);
            border-left: 4px solid var(--xavier-gold);
        }

        footer {
            text-align: center;
            font-size: 0.65rem;
            color: var(--xavier-gray-text);
            padding: 1rem;
            margin-top: 1rem;
        }

        /* ========== MODAL/FORM STYLES (Keep from original) ========== */
        .swal2-popup { width: 1000px !important; max-width: 95vw !important; }
        .swal2-html-container { overflow-y: auto !important; max-height: 70vh !important; }

        .form-group { margin-bottom: 0.8rem; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.2rem; color: var(--xavier-primary); font-size: 0.8rem; }
        .form-group label .required { color: #e74c3c; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.8rem;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }

        .form-section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--xavier-primary);
            border-bottom: 2px solid var(--xavier-gold);
            padding-bottom: 0.3rem;
            margin: 0.8rem 0;
        }
        .form-subsection-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--xavier-primary);
            margin: 0.6rem 0 0.3rem 0;
            padding-left: 0.3rem;
            border-left: 3px solid var(--xavier-gold);
        }

        .eligibility-card {
            background: #f8f9fa;
            border-radius: 0.8rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--xavier-gold);
            cursor: pointer;
            transition: 0.2s;
        }
        .eligibility-card.selected {
            border-left-color: var(--xavier-primary);
            background: #eef2fa;
        }
        .eligibility-card h3 { color: var(--xavier-primary); font-size: 1rem; margin-bottom: 0.4rem; font-weight: 700; }
        .eligibility-card .amount { font-weight: bold; color: var(--xavier-gold); font-size: 0.8rem; margin-bottom: 0.3rem; }
        .eligibility-card .focus { font-size: 0.75rem; color: #555; margin-bottom: 0.5rem; }
        .eligibility-card .eligibility-title { font-weight: 600; font-size: 0.7rem; color: var(--xavier-primary); margin-top: 0.3rem; margin-bottom: 0.2rem; }
        .eligibility-card ul { margin-left: 1.2rem; font-size: 0.7rem; color: #666; }

        .activity-card {
            background: #f8f9fa;
            border-radius: 0.8rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--xavier-gold);
        }
        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e0e0e0;
        }
        .activity-title { font-weight: 700; color: var(--xavier-primary); font-size: 0.9rem; }
        .activity-field { margin-bottom: 0.8rem; }
        .activity-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--xavier-primary);
            margin-bottom: 0.2rem;
        }
        .activity-field input, .activity-field textarea {
            width: 100%;
            padding: 0.5rem;
            font-size: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .date-range-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }
        .date-range-row label { font-size: 0.7rem; font-weight: 600; color: var(--xavier-primary); }
        .date-range-row input[type="date"] {
            padding: 0.4rem;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .date-range-row input[type="date"]:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .activity-hint {
            display: block;
            font-size: 0.65rem;
            color: #666;
            margin-top: 0.4rem;
        }

        .budget-card {
            background: #f8f9fa;

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// Convert file to Base64 
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

// PDF Viewer for Faculty - Opens in new tab
function openPDFViewer(fileName, base64Data) {
    if (!base64Data) {
        showInlineNotification(null, 'No PDF data available', false);
        return;
    }
    
    // Clean up the base64 data
    let cleanBase64 = base64Data;
    
    // Remove any existing data URL prefix if present
    if (cleanBase64.includes('base64,')) {
        cleanBase64 = cleanBase64.split('base64,')[1];
    }
    
    // Remove whitespace and newlines
    cleanBase64 = cleanBase64.replace(/\s/g, '');
    
    // Validate it looks like base64
    if (!/^[A-Za-z0-9+/=]+$/.test(cleanBase64)) {
        showInlineNotification(null, 'Invalid PDF data format', false);
        return;
    }
    
    try {
        // Decode base64 to binary
        const byteCharacters = atob(cleanBase64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'application/pdf' });
        
        // Create object URL and open in new tab
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
        
        // Clean up the object URL after a delay
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        
    } catch (error) {
        console.error('PDF opening failed:', error);
        showInlineNotification(null, 'Failed to open PDF. The file may be corrupted.', false);
    }
}

}

function scrollToFirstError(modalElement) {
    let firstError = modalElement.querySelector('.form-group.missing, .card-error-message, .cv-pending-status[style*="border: 2px solid rgb(231, 76, 60)"]');
    
    if (!firstError) {
        firstError = modalElement.querySelector('.cv-pending-status');
        if (firstError && firstError.style.border !== '2px solid rgb(231, 76, 60)') {
            firstError = null;
        }
    }
    
    if (firstError) {
        let tabContainer = firstError.closest('.tab-content');
        if (tabContainer) {
            const tabId = tabContainer.id;
            let targetTabId = '';
            
            if (tabId === 'tabXurg1') targetTabId = 'xurg1';
            else if (tabId === 'tabXurg2') targetTabId = 'xurg2';
            else if (tabId === 'tabCV') targetTabId = 'cv';
            
            if (targetTabId) {
                const tabButton = modalElement.querySelector(`.tab-btn[data-tab="${targetTabId}"]`);
                if (tabButton && !tabButton.classList.contains('active')) {
                    tabButton.click();
                }
            }
        }
        
        setTimeout(() => {
            firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
            firstError.style.transition = 'background-color 0.3s';
            firstError.style.backgroundColor = '#ffecec';
            setTimeout(() => {
                if (firstError) firstError.style.backgroundColor = '';
            }, 1500);
        }, 150);
    }
}

function showToast(icon, title, message, color) {
    const toast = document.createElement('div');
    toast.className = `toast-notification`;
    toast.innerHTML = `
        <div class="toast-content">
            <div class="toast-icon">${icon}</div>
            <div class="toast-message">
                <div style="font-weight: 600; margin-bottom: 0.2rem;">${title}</div>
                <div style="font-size: 0.7rem; color: #666;">${message}</div>
            </div>
            <button class="toast-close">&times;</button>
        </div>
    `;
    
    document.body.appendChild(toast);
    
    const timeout = setTimeout(() => {
        if (toast && toast.remove) {
            toast.style.animation = 'slideOutRight 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }
    }, 5000);
    
    const closeBtn = toast.querySelector('.toast-close');
    if (closeBtn) {
        closeBtn.addEventListener('click', () => {
            clearTimeout(timeout);
            toast.style.animation = 'slideOutRight 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        });
    }
}

    }
}

function getTimeAgo(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);
    
    if (diff < 60) return `${diff} seconds ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)} minutes ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} hours ago`;
    return `${Math.floor(diff / 86400)} days ago`;
}

        const bell = document.getElementById('notificationBell');
        const dropdown = document.getElementById('notificationDropdown');
        
        if (bell && dropdown) {
            bell.addEventListener('click', async (e) => {
                e.stopPropagation();

                dropdown.style.display = isVisible ? 'none' : 'block';
                if (!isVisible) {
                    await renderNotificationDropdown(currentUser.email);
                }
            });
        }
        
        const markAllBtn = document.getElementById('markAllReadBtn');
        if (markAllBtn) {
            markAllBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                await KURO_API.markAllNotificationsRead(currentUser.email);
                updateNotificationBadge(currentUser.email);
                await renderNotificationDropdown(currentUser.email);
            });
        }
        
        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (dropdown && bell) {
                if (!dropdown.contains(e.target) && !bell.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            }
        });
    }
}

function filterAndRenderApps(filteredSubs, drafts) {
    const grantFilter = document.getElementById('grantFilter')?.value || 'all';
    const statusFilter = document.getElementById('statusFilter')?.value || 'all';
    const cvFilter = document.getElementById('cvFilter')?.value || 'all';
    const searchFilter = document.getElementById('searchFilter')?.value || '';
    
    let filteredApps = filteredSubs.filter(app => {
        if (grantFilter !== 'all' && app.grantTitle !== grantFilter) return false;
        if (statusFilter !== 'all' && app.status !== statusFilter) return false;
        if (cvFilter !== 'all') {
            const cvStat = getCVStatusSummary(app);
            if (cvFilter === 'eligible' && cvStat.eligible === 0) return false;
            if (cvFilter === 'pending' && cvStat.pending === 0) return false;
            if (cvFilter === 'missing' && cvStat.missing === 0) return false;
            if (cvFilter === 'ineligible' && cvStat.ineligible === 0) return false;
        }
        if (searchFilter) {
            const s = searchFilter.toLowerCase();
            if (!(app.proposalTitle || '').toLowerCase().includes(s) && !(app.piName || '').toLowerCase().includes(s)) return false;
        }
        return true;
    });
    
    renderApplicationsList(filteredApps, drafts);
}

function renderApplicationsList(filteredSubs, drafts) {
    const container = document.getElementById('applicationsList');
    if (!container) return;
    
    let html = '';
    
    for (const sub of filteredSubs) {
        const cvStatus = getCVStatusSummary(sub);
        let cvStatusText = '', cvStatusClass = '';
        if (cvStatus.eligible === cvStatus.total) { cvStatusText = '✅ CV Eligible'; cvStatusClass = 'cv-eligible'; }
        else if (cvStatus.ineligible > 0) { cvStatusText = `❌ ${cvStatus.ineligible} CV Ineligible`; cvStatusClass = 'cv-ineligible'; }
        else if (cvStatus.pending > 0) { cvStatusText = `⏳ ${cvStatus.pending} CV Pending`; cvStatusClass = 'cv-pending'; }
        else { cvStatusText = `📄 ${cvStatus.missing} CV Missing`; cvStatusClass = 'cv-missing'; }
        
        const cvProgressPercent = ((cvStatus.eligible + cvStatus.pending) / cvStatus.total) * 100;
        let cvProgressClass = cvStatus.ineligible > 0 ? 'bad' : (cvStatus.pending > 0 ? 'warning' : 'good');
        
        const chairSigned = sub.signatures?.chair?.signed || false;
        const deanSigned = sub.signatures?.dean?.signed || false;
        const bothSigned = chairSigned && deanSigned;
        const requestsSent = sub.signatureRequests?.sentAt;

        else { signatureStatusText = '⏳ Pending'; signatureStatusClass = 'signature-pending'; }
        
        const statusIcon = getStatusIcon(sub.status);

        const statusDisplay = getStatusDisplayName(sub.status);
        const returnClass = sub.status === 'Returned' ? 'returned' : '';
        
        html += `<div class="application-card ${returnClass}" data-id="${sub.id}">

                    <span class="status-badge ${signatureStatusClass}"><i class="fas fa-signature"></i> ${signatureStatusText}</span>

        }
        
        html += `<div class="cv-progress-section">
                    <div class="cv-progress-label"><i class="fas fa-chart-line"></i> CV Completion Progress</div>
                    <div class="cv-progress-bar"><div class="cv-progress-fill ${cvProgressClass}" style="width: ${cvProgressPercent}%"></div></div>
                    <div class="cv-stats">
                        <span class="cv-stat eligible"><i class="fas fa-check-circle"></i> ${cvStatus.eligible} Eligible</span>
                        <span class="cv-stat pending"><i class="fas fa-clock"></i> ${cvStatus.pending} Pending</span>

                        <span class="cv-stat missing"><i class="fas fa-file"></i> ${cvStatus.missing} Missing</span>
                    </div>
                </div>
            </div>
            <div class="card-actions-modern">
                <button class="card-action-btn view-sub" data-id="${sub.id}"><i class="fas fa-eye"></i> View Details</button>`;
        
        if (sub.status === 'Returned') {

    document.querySelectorAll('.resubmit-sub').forEach(btn => btn.addEventListener('click', async (e) => { const id = btn.getAttribute('data-id'); const sub = filteredSubs.find(s => s.id === id); if(sub) await resubmitApplication(sub); }));
    document.querySelectorAll('.delete-sub').forEach(btn => btn.addEventListener('click', async (e) => { const id = btn.getAttribute('data-id'); const result = await confirmDelete('this application'); if (result.isConfirmed) { await KURO_API.deleteApplication(id); await renderApplicant(); await showSuccess('Application deleted!', 'Deleted'); } }));

    document.querySelectorAll('.delete-draft').forEach(btn => btn.addEventListener('click', async (e) => { const idx = parseInt(btn.getAttribute('data-idx')); const draft = drafts[idx]; const result = await confirmDelete(draft?.proposalTitle || 'this draft'); if (result.isConfirmed) { await KURO_API.deleteFacultyDraft(draft.draftId || draft.id); await renderApplicant(); await showSuccess('Draft deleted!', 'Deleted'); } }));
    document.querySelectorAll('.resend-signature-btn').forEach(btn => { btn.addEventListener('click', async () => { const id = btn.getAttribute('data-id'); const sub = filteredSubs.find(s => s.id === id); if (sub) await resendSignatureRequests(sub); else showInlineNotification(null, 'Application not found', false); }); });
}

function getStatusDisplayName(status) {
    const names = {
        'Awaiting Signatures': 'Awaiting Signatures',
        'Pending Eligibility Check': 'Eligibility Review',
        'Pending Secondary Check': 'Secondary Review',
        'Pending Final Check': 'Final Review',
        'Approved': 'Approved',
        'Returned': 'Returned for Revision'
    };
    return names[status] || status;
}

function getStatusIcon(status) {
    const icons = {
        'Awaiting Signatures': '⏳',
        'Pending Eligibility Check': '🔍',
        'Pending Secondary Check': '📋',
        'Pending Final Check': '✅',
        'Approved': '🎉',
        'Returned': '↩️'
    };
    return icons[status] || '📄';
}

function getStatusClass(status) {
    const classes = {
        'Awaiting Signatures': 'application-awaiting',
        'Pending Eligibility Check': 'application-pending-check',
        'Pending Secondary Check': 'application-pending-check',
        'Pending Final Check': 'application-pending-check',
        'Approved': 'application-approved',
        'Returned': 'application-returned'
    };
    return classes[status] || 'application-review';
}

// Helper function for CV status summary
function getCVStatusSummary(app) {
    let eligible = 0, pending = 0, ineligible = 0, missing = 0;
    
    // Count team members
    const teamMembersCount = (app.teamMembers && Array.isArray(app.teamMembers)) ? app.teamMembers.length : 0;
    
    // Total CVs needed = 1 (PI) + team members count
    let total = 1 + teamMembersCount;
    
    // ========== PI CV ==========
    if (app.piCVName && app.piCVName.trim() !== '') {
        // CV file exists
        if (app.piCVStatus === 'eligible') {
            eligible++;
        } else if (app.piCVStatus === 'ineligible') {
            ineligible++;
        } else {
            // Has file but status not set yet (pending review)
            pending++;
        }
    } else {
        // No CV uploaded
        missing++;
    }
    
    // ========== Team CVs ==========
    if (teamMembersCount > 0) {
        // Ensure teamCVs array exists
        if (!app.teamCVs || !Array.isArray(app.teamCVs)) {
            app.teamCVs = [];
        }
        
        // Only iterate up to the number of team members (not the full array length)
        for (let i = 0; i < teamMembersCount; i++) {
            const cv = (app.teamCVs && app.teamCVs[i]) ? app.teamCVs[i] : null;
            
            if (cv && cv.name && cv.name.trim() !== '') {
                // CV file exists
                if (cv.status === 'eligible') {
                    eligible++;
                } else if (cv.status === 'ineligible') {
                    ineligible++;
                } else {
                    // Has file but status not set yet (pending review)
                    pending++;
                }
            } else {
                // No CV uploaded for this member
                missing++;
            }
        }
    }
    
    return { eligible, pending, ineligible, missing, total };
}

function normalizeFormDataForComparison(formData) {
    const normalized = {};
    for (let key in formData) {
        if (formData[key] === undefined || formData[key] === null) {
            normalized[key] = '';
        } else if (typeof formData[key] === 'string') {
            normalized[key] = formData[key].trim();
        } else {
            normalized[key] = formData[key];
        }
    }
    return normalized;
}

async function resubmitApplication(app) {
    const result = await Swal.fire({
        title: 'Resubmit Application?',
        html: `<div style="text-align: left;">
            <p>You are about to resubmit this returned application.</p>
            <p style="margin-top: 0.5rem;"><strong>Make sure you have addressed the feedback:</strong></p>
            <div style="background: #fff3cd; padding: 0.8rem; border-radius: 0.5rem; margin-top: 0.5rem;">
                ${escapeHtml(app.returnedFeedback || 'No specific feedback provided.')}
            </div>
            <p class="demo-note" style="margin-top: 1rem;"><i class="fas fa-info-circle"></i> The existing signatures will remain valid. Chair and Dean do NOT need to sign again.</p>
        </div>`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#D4AF37',
        confirmButtonText: 'Yes, Resubmit',
        cancelButtonText: 'Cancel'
    });
    
    if (result.isConfirmed) {
        try {
            // Call API to resubmit - KEEP existing signatures
            const updatedApp = await KURO_API.resubmitApplication(app.id, {
                status: 'Awaiting Signatures', // Or go back to previous check stage
                returnedFeedback: null,
                submittedDate: new Date().toISOString().slice(0, 10)
                // DO NOT reset signatures - keep them!
            });
            
            // Add notification to faculty
            await KURO_API.createNotification({
                userEmail: currentUser.email,
                type: 'resubmission',
                title: '📤 Application Resubmitted',
                message: `Your application "${app.proposalTitle}" has been resubmitted for review.`,
                appId: app.id,
                icon: '📤',
                color: '#2ecc71'
            });
            
            showInlineNotification(null, '✓ Application resubmitted!', true);
            await renderApplicant();
            
        } catch (error) {
            console.error('Resubmit failed:', error);
            showInlineNotification(null, 'Failed to resubmit application. Please try again.', false);
        }
    }
}

async function openGrantSelectionWithPreselected(preselectedGrant) {
    console.log('openGrantSelectionWithPreselected called with:', preselectedGrant);
    
    // Store the current data before showing grant selection
    const preservedData = currentDraftData ? JSON.parse(JSON.stringify(currentDraftData)) : null;
    const preservedEditMode = isEditMode;
    const preservedEditAppId = editAppId;
    
    let optionsHtml = '';
    for (const [grant, data] of Object.entries(FACULTY_GRANTS_DATA)) {
        const isSelected = (grant === preselectedGrant);
        optionsHtml += '<div class="eligibility-card" data-grant="' + grant + '" ' + (isSelected ? 'data-selected="true"' : '') + '>';

        optionsHtml += '<div class="eligibility-title">Eligibility:</div>';
        optionsHtml += '<ul>' + data.eligibility.split('<br>').map(item => '<li>' + item + '</li>').join('') + '</ul>';
        optionsHtml += '</div>';
    }
    
    const result = await Swal.fire({
        title: '<div style="display: flex; justify-content: space-between; align-items: center;"><span>Select Research Grant</span><button id="customCloseBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; line-height: 1; padding: 0 8px;">&times;</button></div>',
        html: '<div id="grantOptions" style="text-align:left; max-height: 60vh; overflow-y: auto;">' + optionsHtml + '</div>',
        confirmButtonText: 'Next →',
        confirmButtonColor: '#D4AF37',
        showCancelButton: true,
        cancelButtonText: 'Cancel',
        cancelButtonColor: '#6c757d',
        didOpen: (modal) => {
            const closeBtn = modal.querySelector('#customCloseBtn');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    Swal.close();
                    // Restore the previous data and reopen form
                    if (preservedData) {
                        currentDraftData = preservedData;
                        selectedGrant = preservedData.grantTitle;
                        isEditMode = preservedEditMode;
                        editAppId = preservedEditAppId;
                        setTimeout(() => {
                            openApplicationForm(isEditMode, currentActiveTab);
                        }, 100);
                    } else {
                        renderApplicant();
                    }
                });
            }
            
            const cards = document.querySelectorAll('#grantOptions .eligibility-card');
            cards.forEach(card => {
                const grantName = card.getAttribute('data-grant');
                if (grantName === preselectedGrant) {
                    card.classList.add('selected');
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                
                card.addEventListener('click', () => {
                    cards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                });
            });
        },
        preConfirm: () => {
            const selected = document.querySelector('#grantOptions .eligibility-card.selected');
            if (!selected) {
                Swal.showValidationMessage('Please select a grant');
                return false;
            }
            return selected.getAttribute('data-grant');
        }
    });
    
    if (result.isConfirmed && result.value) {
        const newGrant = result.value;
        
        if (newGrant !== preselectedGrant) {
            // Grant changed - update the data
            selectedGrant = newGrant;
            if (currentDraftData) {
                currentDraftData.grantTitle = newGrant;
                // Keep all other data the same
                saveDrafts();
            }
        }
        
        // Reopen the form with the same data (preserved or updated)
        await openApplicationForm(isEditMode, currentActiveTab);
    } else if (result.dismiss === Swal.DismissReason.cancel) {
        // User cancelled - restore previous data and reopen form
        if (preservedData) {
            currentDraftData = preservedData;
            selectedGrant = preservedData.grantTitle;
            isEditMode = preservedEditMode;
            editAppId = preservedEditAppId;
        }
        await openApplicationForm(isEditMode, currentActiveTab);
    }
}

async function generateAndSendSignatureLinks(application) {
    if (!application.chairEmail || !application.deanEmail) {
        console.warn('Missing chair or dean email');
        showInlineNotification(null, 'Missing chair or dean email addresses. Cannot send signature requests.', false);
        return false;
    }
    
    showInlineNotification(null, '📧 Generating signature links...', true);
    
    try {
        const result = await KURO_API.generateSignatureLinks(application.id, {
            chairEmail: application.chairEmail,
            chairName: application.fromChair,
            deanEmail: application.deanEmail,
            deanName: application.deanName,
            proposalTitle: application.proposalTitle,
            piName: application.piName
        });
        
        console.log('Signature links generated:', result);
        
        await KURO_API.sendSignatureEmails(application.id, {
            chairLink: result.chairLink,
            deanLink: result.deanLink,
            chairEmail: application.chairEmail,
            deanEmail: application.deanEmail,
            chairName: application.fromChair,
            deanName: application.deanName,
            expiryDays: 7
        });
        
        showInlineNotification(null, '✓ Signature requests sent successfully!', true);
        return true;
        
    } catch (error) {
        console.error('Failed to generate signature links:', error);
        showInlineNotification(null, '⚠️ Failed to send signature requests. Please try again.', false);
        return false;
    }
}

async function autoGenerateSignatureLinks(application, appId, showNotifications = true) {
    if (!application.chairEmail || !application.deanEmail) {
        showInlineNotification(null, 'Missing chair or dean email addresses.', false);
        return;
    }
    
    if (showNotifications) {
        showInlineNotification(null, '📧 Generating signature links...', true);
    }
    
    try {
        // Generate signature links via backend API
        const result = await KURO_API.generateSignatureLinks(appId, {
            chairEmail: application.chairEmail,
            chairName: application.fromChair,
            deanEmail: application.deanEmail,
            deanName: application.deanName,
            proposalTitle: application.proposalTitle,
            piName: application.piName
        });
        
        console.log('Signature links generated:', result);
        
        // Send emails via backend API
        const emailResult = await KURO_API.sendSignatureEmails(appId, {
            chairLink: result.chairLink,
            deanLink: result.deanLink,
            chairEmail: application.chairEmail,
            deanEmail: application.deanEmail,
            chairName: application.fromChair,
            deanName: application.deanName,
            expiryDays: 7
        });
        
        if (showNotifications) {
            if (emailResult.success) {
                showInlineNotification(null, '✓ Signature requests sent successfully!', true);
            } else {
                showInlineNotification(null, '⚠️ Some emails failed to send. Please check the email addresses.', false);
            }
        }
        
    } catch (error) {
        console.error('Failed:', error);
        showInlineNotification(null, '⚠️ Failed to send signature requests.', false);
    }
}

    if (bothSigned) {
        await Swal.fire({
            icon: 'info',

async function checkSignatureStatus() {
    try {
        const mySubs = await KURO_API.getFacultyApplications();
        
        for (const sub of mySubs) {
            if (sub.signatureRequests?.chairToken || sub.signatureRequests?.deanToken) {
                const status = await KURO_API.getSignatureStatus(sub.id);
                
                if (status.chairCompleted && !sub.signatures?.chair?.signed) {
                    if (!sub.signatures) sub.signatures = {};
                    sub.signatures.chair = { signed: true, signedDate: status.chairSignedAt };
                    await KURO_API.updateApplication(sub.id, sub);
                    renderApplicant();
                    showInlineNotification(null, 'Chair signature received!', true);
                }
                
                if (status.deanCompleted && !sub.signatures?.dean?.signed) {
                    if (!sub.signatures) sub.signatures = {};
                    sub.signatures.dean = { signed: true, signedDate: status.deanSignedAt };
                    await KURO_API.updateApplication(sub.id, sub);
                    renderApplicant();
                    showInlineNotification(null, 'Dean signature received!', true);
                }
            }
        }
    } catch (error) {
        console.error('Failed to check signature status:', error);
    }
}

window.updateEndDateMin = function(startDateInput) {
    const activityCard = startDateInput.closest('.activity-card');
    const endDateInput = activityCard.querySelector('.act-end-date');
    const startDate = startDateInput.value;
    
    if (startDate) {
        endDateInput.disabled = false;
        endDateInput.min = startDate;
        if (endDateInput.value && endDateInput.value < startDate) {
            endDateInput.value = '';
        }
    } else {
        endDateInput.disabled = true;
        endDateInput.value = '';
        endDateInput.min = '';
    }
};

async function collectFormData() {
    let piCVName = '';
    let piCVData = '';
    
    // ========== PI CV - ALWAYS check file input FIRST ==========
    const piCVInput = document.getElementById('piCV');
    if (piCVInput && piCVInput.files && piCVInput.files.length > 0) {
        const file = piCVInput.files[0];
        console.log('🔍 Found NEW PI CV file in input:', file.name);
        if (file.size > 10 * 1024 * 1024) {
            showFormNotification('CV file exceeds 10MB limit', true);
            piCVInput.value = '';
        } else {
            piCVName = file.name;
            piCVData = await fileToBase64(file);
            console.log('✅ NEW PI CV captured:', piCVName);
        }
    }
    // ONLY if no file was selected, then preserve existing
    else if (currentDraftData && currentDraftData.piCVName) {
        piCVName = currentDraftData.piCVName;
        piCVData = currentDraftData.piCVData || '';
        console.log('📁 No new PI CV - preserved existing:', piCVName);
    }
    
    // Get team members from DOM
    const teamMembers = Array.from(document.querySelectorAll('#teamMembersContainer .member-row'))
        .map(row => ({ 
            name: (row.children[0]?.value || '').trim(), 
            role: (row.children[1]?.value || '').trim() 
        }))
        .filter(member => member.name !== '');
    
    // Initialize arrays
    let teamCVs = new Array(teamMembers.length).fill(null);
    let teamCVData = new Array(teamMembers.length).fill(null);
    
    // ========== TEAM CVs - ALWAYS check file inputs FIRST ==========
    for (let i = 0; i < teamMembers.length; i++) {
        const teamCVInput = document.getElementById('teamCV_' + i);
        
        // FIRST: Check if a NEW file was uploaded
        if (teamCVInput && teamCVInput.files && teamCVInput.files.length > 0) {
            const file = teamCVInput.files[0];
            console.log(`🔍 Found NEW team CV file for member ${i}:`, file.name);
            if (file.size > 10 * 1024 * 1024) {
                showFormNotification('CV file for team member exceeds 10MB limit', true);
                teamCVInput.value = '';
            } else {
                const base64Data = await fileToBase64(file);
                teamCVs[i] = { 
                    name: file.name,
                    status: 'pending'
                };
                teamCVData[i] = base64Data;
                console.log(`✅ NEW team CV captured for member ${i}:`, file.name);
            }
        }
        // ONLY if no new file, preserve existing
        else if (currentDraftData && currentDraftData.teamCVs && currentDraftData.teamCVs[i] && currentDraftData.teamCVs[i].name) {
            teamCVs[i] = { ...currentDraftData.teamCVs[i] };
            if (currentDraftData.teamCVData && currentDraftData.teamCVData[i]) {
                teamCVData[i] = currentDraftData.teamCVData[i];
            }
            console.log(`📁 No new file for member ${i} - preserved existing:`, teamCVs[i].name);
        }
    }
    
    // Collect activities
    const activities = [];
    const activityCards = document.querySelectorAll('#activitiesContainer .activity-card');
    activityCards.forEach(card => {
        const activity = {
            name: card.querySelector('.act-name')?.value || '',
            description: card.querySelector('.act-desc')?.value || '',
            objective: card.querySelector('.act-objective')?.value || '',
            output: card.querySelector('.act-output')?.value || '',
            startDate: card.querySelector('.act-start-date')?.value || '',
            endDate: card.querySelector('.act-end-date')?.value || ''
        };
        if (activity.name.trim() !== '') {
            activities.push(activity);
        }
    });
    
    // Collect budget items
    const budgetItems = [];
    const budgetCards = document.querySelectorAll('.budget-card');
    budgetCards.forEach(card => {
        const category = card.querySelector('.budget-category')?.value || '';
        const subcategory = card.querySelector('.budget-subcategory')?.value || '';
        const itemName = card.querySelector('.budget-item-select')?.value || '';
        const specs = card.querySelector('.budget-specs')?.value || '';
        const unitCost = parseFloat(card.querySelector('.budget-unit-cost')?.value) || 0;
        const qty = parseFloat(card.querySelector('.budget-qty')?.value) || 1;
        
        if (category !== '' || itemName !== '') {
            budgetItems.push({
                category: category,
                subcategory: subcategory,
                itemName: itemName,
                specs: specs,
                unitCost: unitCost,
                qty: qty
            });
        }
    });
    
    return {
        // Form 1 - Project Profile
        proposalTitle: document.getElementById('projTitle')?.value || '',
        piName: document.getElementById('piName')?.value || '',
        piEmail: document.getElementById('piEmail')?.value || '',
        dept: document.getElementById('dept')?.value || '',
        school: document.getElementById('school')?.value || '',
        extension: document.getElementById('extension')?.value || '',
        duration: document.getElementById('duration')?.value || '',
        
        // Form 1 - Proposal Content
        rationale: document.getElementById('rationale')?.value || '',
        litReview: document.getElementById('litReview')?.value || '',
        objectives: document.getElementById('objectives')?.value || '',
        methodology: document.getElementById('methodology')?.value || '',
        outputs: document.getElementById('outputs')?.value || '',
        references: Array.from(document.querySelectorAll('#referencesContainer .reference-row input')).map(inp => inp.value).filter(v => v && v.trim() !== ''),
        
        // Form 1 - Team & Activities
        teamMembers: teamMembers,
        activities: activities,
        budgetItems: budgetItems,
        
        // Form 2 - Endorsement Information
        endorsementDate: document.getElementById('endorsementDate')?.value || '',
        endorseDept: document.getElementById('endorseDept')?.value || '',
        endorseSchool: document.getElementById('endorseSchool')?.value || '',
        schoolYear: document.getElementById('schoolYear')?.value || '',
        
        // Form 2 - Signatures
        fromChair: document.getElementById('fromChair')?.value || '',
        chairEmail: document.getElementById('chairEmail')?.value || '',
        deanName: document.getElementById('deanName')?.value || '',
        deanEmail: document.getElementById('deanEmail')?.value || '',
        
        // Signatures status
        signatures: { chair: false, dean: false },
        
        // CV Uploads
        piCVName: piCVName,
        piCVData: piCVData,
        teamCVs: teamCVs,
        teamCVData: teamCVData
    };
}

function validateActivityDates(activities) {
    for (let i = 0; i < activities.length; i++) {
        const act = activities[i];
        if (act.startDate && act.endDate) {
            if (new Date(act.endDate) < new Date(act.startDate)) {
                Swal.fire('Error', `Activity "${act.name}" has an end date before its start date.`, 'error');
                return false;
            }
        }
    }
    return true;
}

function validateAndHighlightFields(formData, modalElement) {
    const errors = [];
    
    // Helper: Check if we're editing an existing application
    const isEditingExisting = isEditMode && editAppId && currentDraftData && Object.keys(currentDraftData).length > 0;
    
    // Helper function to safely check if a field has value (from either formData or currentDraftData)
    function hasValue(value) {
        return value && value.toString().trim() !== '';
    }
    
    function markField(field, errorMessage) {
        if (!field) return;
        const formGroup = field.closest('.form-group, .budget-field, .activity-field');
        if (formGroup) {
            formGroup.classList.add('missing');
            const existingError = formGroup.querySelector('.field-error-message');
            if (existingError) existingError.remove();
            const errorSpan = document.createElement('small');
            errorSpan.className = 'field-error-message';
            errorSpan.style.color = '#e74c3c';
            errorSpan.style.fontSize = '0.7rem';
            errorSpan.style.display = 'block';
            errorSpan.style.marginTop = '0.25rem';
            errorSpan.innerHTML = '⚠️ ' + errorMessage;
            formGroup.appendChild(errorSpan);
        }
        if (field) {
            field.style.animation = 'shake 0.3s ease-in-out';
            setTimeout(() => { if (field) field.style.animation = ''; }, 300);
        }
        errors.push({ field, message: errorMessage });
    }
    
    function markCard(card, errorMessage) {
        if (!card) return;
        card.style.border = '2px solid #e74c3c';
        card.style.backgroundColor = '#fff5f5';
        card.style.animation = 'shake 0.3s ease-in-out';
        setTimeout(() => { if (card) card.style.animation = ''; }, 300);
        
        const existingError = card.querySelector('.card-error-message');
        if (existingError) existingError.remove();
        const errorSpan = document.createElement('small');
        errorSpan.className = 'card-error-message';
        errorSpan.style.color = '#e74c3c';
        errorSpan.style.fontSize = '0.7rem';
        errorSpan.style.display = 'block';
        errorSpan.style.marginTop = '0.5rem';
        errorSpan.style.textAlign = 'center';
        errorSpan.innerHTML = '⚠️ ' + errorMessage;
        card.appendChild(errorSpan);
        errors.push({ card, message: errorMessage });
    }
    
    function highlightSubsectionByText(searchText) {
        const subsections = modalElement ? modalElement.querySelectorAll('.form-subsection-title') : document.querySelectorAll('.form-subsection-title');
        for (const subsection of subsections) {
            if (subsection.textContent.includes(searchText)) {
                subsection.style.color = '#e74c3c';
                subsection.style.borderLeftColor = '#e74c3c';
                break;
            }
        }
    }
    
    // ========== FORM 1 VALIDATION ==========
    
    // Project Profile - Check if empty AND not editing existing with value
    if (!hasValue(formData.proposalTitle) && (!isEditingExisting || !hasValue(currentDraftData?.proposalTitle))) {
        const field = modalElement?.querySelector('#projTitle');
        markField(field, 'Project Title is required');
        highlightSubsectionByText('📌 Project Profile');
    }
    
    if (!hasValue(formData.piName) && (!isEditingExisting || !hasValue(currentDraftData?.piName))) {
        const field = modalElement?.querySelector('#piName');
        markField(field, 'Principal Investigator name is required');
        highlightSubsectionByText('📌 Project Profile');
    }
    
    if (!hasValue(formData.piEmail) && (!isEditingExisting || !hasValue(currentDraftData?.piEmail))) {
        const field = modalElement?.querySelector('#piEmail');
        markField(field, 'Email Address is required');
        highlightSubsectionByText('📌 Project Profile');
    } else if (hasValue(formData.piEmail) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.piEmail)) {
        const field = modalElement?.querySelector('#piEmail');
        markField(field, 'Valid email address is required');
        highlightSubsectionByText('📌 Project Profile');
    }
    
    if (!hasValue(formData.dept) && (!isEditingExisting || !hasValue(currentDraftData?.dept))) {
        const field = modalElement?.querySelector('#dept');
        markField(field, 'Department is required');
        highlightSubsectionByText('📌 Project Profile');
    }
    
    if (!hasValue(formData.school) && (!isEditingExisting || !hasValue(currentDraftData?.school))) {
        const field = modalElement?.querySelector('#school');
        markField(field, 'School/College is required');
        highlightSubsectionByText('📌 Project Profile');
    }
    
    if (!hasValue(formData.extension) && (!isEditingExisting || !hasValue(currentDraftData?.extension))) {
        const field = modalElement?.querySelector('#extension');
        markField(field, 'Local Extension is required');
        highlightSubsectionByText('📌 Project Profile');
    }
    
    if (!hasValue(formData.duration) && (!isEditingExisting || !hasValue(currentDraftData?.duration))) {
        const field = modalElement?.querySelector('#duration');
        markField(field, 'Project Duration is required');
        highlightSubsectionByText('📌 Project Profile');
    }
    
    // Rationale
    if (!hasValue(formData.rationale) && (!isEditingExisting || !hasValue(currentDraftData?.rationale))) {
        const field = modalElement?.querySelector('#rationale');
        markField(field, 'Rationale is required');
        highlightSubsectionByText('📖 Rationale');
    }
    
    // Literature Review

        markField(field, 'Objectives are required');
        highlightSubsectionByText('🎯 Objectives');
    }

        markField(field, 'Dean name is required');
        highlightSubsectionByText('✍️ Digital Signatures');
    }
    
    if (!hasValue(formData.deanEmail) && (!isEditingExisting || !hasValue(currentDraftData?.deanEmail))) {
        const field = modalElement?.querySelector('#deanEmail');
        markField(field, 'Dean email is required');
        highlightSubsectionByText('✍️ Digital Signatures');

    if (!hasValue(formData.endorseDept) && (!isEditingExisting || !hasValue(currentDraftData?.endorseDept))) {
        const field = modalElement?.querySelector('#endorseDept');
        markField(field, 'Department is required');

    if (!hasValue(formData.endorseSchool) && (!isEditingExisting || !hasValue(currentDraftData?.endorseSchool))) {

        highlightSubsectionByText('📌 Endorsement Information');

    console.log(`Validation complete: ${errors.length} errors found`);
    console.log('Edit mode:', isEditingExisting);
    
    return errors;

async function saveDraftToStorage(showNotification = true, modalEl = null) {
    const formData = collectFormData();
    
    if (!formData.proposalTitle || formData.proposalTitle.trim() === '') {
        if (showNotification) {
            showFormNotification('Please add a Project Title before saving as draft.', true, modalEl);
        }
        return false;
    }
    
    // Set endorsement date to today
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    const currentDate = `${year}-${month}-${day}`;
    formData.endorsementDate = currentDate;
    
    // Get or create draft ID
    let draftId = sessionStorage.getItem('current_draft_id');
    if (!draftId) {
        draftId = 'DRF_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        sessionStorage.setItem('current_draft_id', draftId);
    }
    
    // Update currentDraftData with latest form data
    if (!currentDraftData) {
        currentDraftData = {};
    }
    Object.assign(currentDraftData, formData);
    currentDraftData.grantTitle = selectedGrant;
    currentDraftData.lastSaved = new Date().toISOString().slice(0, 10);
    currentDraftData.lastSavedTime = new Date().toISOString();
    currentDraftData.draftId = draftId;
    currentDraftData.userEmail = currentUser.email;
    
    try {
        // Save via API
        await KURO_API.saveFacultyDraft(currentDraftData);
        
        if (showNotification) {
            showFormNotification('✓ Draft saved successfully!', false, modalEl);
        }
        
        return true;
    } catch (error) {
        console.error('Failed to save draft:', error);
        if (showNotification) {
            showFormNotification('❌ Failed to save draft. Please try again.', true, modalEl);
        }
        return false;
    }
}

async function saveDrafts() {
    if (currentDraftData && currentDraftData.draftId) {
        try {
            await KURO_API.saveFacultyDraft(currentDraftData);
            console.log('Draft auto-saved:', currentDraftData.draftId);
        } catch (error) {
            console.error('Failed to auto-save draft:', error);
        }
    }
}

function attachCVFileHandlers(modalElement) {
    // ========== PI CV UPLOAD HANDLER ==========
    const piCVInput = modalElement.querySelector('#piCV');
    if (piCVInput) {
        piCVInput.removeEventListener('change', piCVInput._listener);
        piCVInput._listener = async function(e) {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                
                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    showInlineNotification(modalElement, 'Only PDF files are allowed!', false);
                    e.target.value = '';
                    return;
                }
                if (file.size > 10 * 1024 * 1024) {
                    showInlineNotification(modalElement, 'File exceeds 10MB limit!', false);
                    e.target.value = '';
                    return;
                }
                
                const oldFile = currentDraftData && currentDraftData.piCVName ? currentDraftData.piCVName : null;
                
                if (currentDraftData) {
                    const base64Data = await fileToBase64(file);
                    currentDraftData.piCVName = file.name;
                    currentDraftData.piCVData = base64Data;
                    currentDraftData.piCVStatus = 'pending';

                    refreshCVTabContentAfterUpload(modalElement);

                        showFormNotification(`⟳ Replaced "${oldFile}" with "${file.name}"`, false, modalElement);

function refreshCVTabContentAfterUpload(modalElement) {
    const cvTabContent = modalElement.querySelector('#tabCV');
    if (cvTabContent && currentDraftData) {
        const updatedTeamMembers = [];
        const teamRows = modalElement.querySelectorAll('#teamMembersContainer .member-row');
        teamRows.forEach(row => {
            const nameInput = row.querySelector('input:first-child');
            if (nameInput && nameInput.value.trim()) {
                updatedTeamMembers.push({ name: nameInput.value.trim() });
            }
        });
        
        const piNameInput = modalElement.querySelector('#piName');
        const updatedPIName = piNameInput ? piNameInput.value.trim() : currentDraftData.piName || '';
        
        currentDraftData.teamMembers = updatedTeamMembers;
        currentDraftData.piName = updatedPIName;
        
        if (!currentDraftData.teamCVs) currentDraftData.teamCVs = [];
        while (currentDraftData.teamCVs.length < updatedTeamMembers.length) {
            currentDraftData.teamCVs.push(null);
        }
        
        const scrollTop = cvTabContent.scrollTop;
        
        cvTabContent.innerHTML = renderCVUploadContent(currentDraftData, updatedTeamMembers);
        
        cvTabContent.scrollTop = scrollTop;
        
        attachCVFileHandlers(modalElement);
        
        // Auto-save after CV upload
        saveDrafts();
        
        const cvTabBtn = modalElement.querySelector('.tab-btn[data-tab="cv"]');
        if (cvTabBtn && !cvTabBtn.classList.contains('active')) {
            cvTabBtn.style.position = 'relative';
            const indicator = cvTabBtn.querySelector('.update-indicator');
            if (!indicator) {
                const span = document.createElement('span');
                span.className = 'update-indicator';
                span.textContent = ' ●';
                span.style.color = '#2ecc71';
                span.style.fontSize = '0.7rem';
                cvTabBtn.appendChild(span);
                setTimeout(() => {
                    if (span) span.remove();
                }, 2000);
            }
        }
    }
}

// New function to remove team member with CV cleanup
window.removeTeamMember = async function(buttonElement) {
    const row = buttonElement.closest('.member-row');
    if (!row) return;
    
    const container = document.getElementById('teamMembersContainer');
    const allRows = Array.from(container.querySelectorAll('.member-row'));
    const indexToRemove = allRows.indexOf(row);
    
    if (indexToRemove !== -1 && currentDraftData) {
        if (currentDraftData.teamCVs && currentDraftData.teamCVs[indexToRemove]) {
            currentDraftData.teamCVs.splice(indexToRemove, 1);
        } else if (currentDraftData.teamCVs && currentDraftData.teamCVs.length > indexToRemove) {
            currentDraftData.teamCVs.splice(indexToRemove, 1);
        }
        
        row.remove();
        
        if (currentDraftData.teamMembers && currentDraftData.teamMembers[indexToRemove]) {
            currentDraftData.teamMembers.splice(indexToRemove, 1);
        }
        
        const remainingRows = container.querySelectorAll('.member-row');
        const newTeamMembers = [];
        const newTeamCVs = [];
        
        for (let i = 0; i < remainingRows.length; i++) {
            const nameInput = remainingRows[i].querySelector('input:first-child');
            if (nameInput && nameInput.value.trim()) {
                newTeamMembers.push({ name: nameInput.value.trim() });
                if (currentDraftData.teamCVs && currentDraftData.teamCVs[i]) {
                    newTeamCVs.push(currentDraftData.teamCVs[i]);
                } else {
                    newTeamCVs.push(null);
                }
            }
        }
        
        currentDraftData.teamMembers = newTeamMembers;
        currentDraftData.teamCVs = newTeamCVs;
        
        await saveDrafts(); // Save via API
        
        if (currentSwalInstance) {
            refreshCVTab(currentSwalInstance);
        }
        
        showInlineNotification(null, 'Team member and their CV removed', true);
    } else {
        row.remove();
    }
};

let currentModalForCV = null;

function renderCVUploadContent(draftData, teamMembersFromForm = []) {
    const d = draftData || {};
    const teamMembers = teamMembersFromForm.length > 0 ? teamMembersFromForm : (d.teamMembers || []);
    const piName = d.piName || '';
    const piCVName = d.piCVName || '';
    const teamCVs = d.teamCVs || [];
    const uploadFeedback = d.uploadFeedback || '';
    
    let html = '<div class="form-section-title">📎 Curriculum Vitae (CV) Uploads</div>';
    html += '<div class="demo-note" style="margin-bottom: 1rem; text-align: left; background: #e8f0fe;"><i class="fas fa-file-pdf"></i> <strong>Note:</strong> Only PDF files are accepted for CV uploads. Maximum file size: 10MB per file.</div>';

    let uploadedCount = (piCVName && piCVName.trim() !== '') ? 1 : 0;
    let totalCount = 1 + teamMembers.length;
    teamMembers.forEach(function(member, idx) {
        if (teamCVs[idx] && teamCVs[idx].name && teamCVs[idx].name.trim() !== '') uploadedCount++;
    });
    const progressPercent = totalCount > 0 ? (uploadedCount / totalCount) * 100 : 0;
    
    html += '<div class="cv-progress-wrapper" style="margin-bottom: 1.5rem;">';
    html += '<div class="cv-progress-header" style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">';
    html += '<span class="cv-progress-label" style="font-size: 0.7rem; font-weight: 600;">CV Upload Progress</span>';
    html += '<span class="cv-progress-count" style="font-size: 0.7rem;">' + uploadedCount + ' / ' + totalCount + ' uploaded</span>';
    html += '</div>';

function updateSubcategories(select) {
    let itemDiv = select.closest('.budget-item-row');
    let subcatSelect = itemDiv.querySelector('.budget-subcategory');
    let category = select.value;
    if (!category || !BUDGET_STRUCTURE[category]) { 
        subcatSelect.innerHTML = '<option value="">Select Subcategory</option>'; 
        return; 
    }
    let options = '<option value="">Select Subcategory</option>';
    for (const sub of Object.keys(BUDGET_STRUCTURE[category])) {
        options += '<option value="' + sub + '">' + sub + '</option>';
    }
    subcatSelect.innerHTML = options;
    if (subcatSelect.onchange) subcatSelect.onchange();
}

function updateSubSubcategories(select) {
    let itemDiv = select.closest('.budget-item-row');
    let itemSelect = itemDiv.querySelector('.budget-item-select');
    let category = itemDiv.querySelector('.budget-category').value;
    let subcategory = select.value;
    if (!category || !subcategory || !BUDGET_STRUCTURE[category] || !BUDGET_STRUCTURE[category][subcategory]) {
        itemSelect.innerHTML = '<option value="">Select Item</option>';
        return;
    }
    let options = '<option value="">Select Item</option>';
    for (const item of BUDGET_STRUCTURE[category][subcategory]) {
        options += '<option value="' + item + '">' + item + '</option>';
    }
    itemSelect.innerHTML = options;
}

function updateBudgetTotals() {
    let total = 0;
    document.querySelectorAll('#budgetContainer .budget-item-row').forEach(row => {
        let unitCost = parseFloat(row.querySelector('.budget-unit-cost')?.value) || 0;
        let qty = parseFloat(row.querySelector('.budget-qty')?.value) || 1;
        const totalSpan = row.querySelector('.budget-total');
        if (totalSpan) totalSpan.innerText = '₱' + (unitCost * qty).toLocaleString();
        total += unitCost * qty;
    });
    let summary = document.querySelector('#budgetSummary');
    if (summary) summary.innerHTML = 'GRAND TOTAL: ₱' + total.toLocaleString();
}
