                                });
                                
                                if (result.isConfirmed) {
                                    const draftId = 'DRF_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
                                    sessionStorage.setItem('current_draft_id', draftId);
                                    
                                    if (!currentDraftData) currentDraftData = {};
                                    Object.assign(currentDraftData, currentFormData);
                                    currentDraftData.grantTitle = selectedGrant;
                                    currentDraftData.draftId = draftId;
                                    currentDraftData.lastSaved = new Date().toISOString().slice(0, 10);
                                    
                                    await saveDrafts();
                                    showInlineNotification(modal, '📝 Draft saved!', true);
                                }
                                
                                setTimeout(() => {
                                    Swal.close();
                                    renderApplicant();
                                }, 300);
                                return;
                            }
                        } else {
                            // No content at all - just close
                            Swal.close();
                            renderApplicant();
                            return;
                        }
                    }
                    
                    // For EDITING existing applications or drafts
                    if (isEditingExistingWithTitle) {
                        // Check if any actual changes were made
                        let hasChanges = false;
                        
                        if (currentDraftData) {
                            const originalData = currentDraftData;
                            
                            // Simple comparison for text fields
                            const textFields = ['proposalTitle', 'piName', 'piEmail', 'dept', 'school', 'rationale', 'objectives', 'methodology', 'outputs'];
                            for (const field of textFields) {
                                if (currentFormData[field] !== (originalData[field] || '')) {
                                    hasChanges = true;
                                    break;
                                }
                            }
                            
                            // Check references
                            if (JSON.stringify(currentFormData.references) !== JSON.stringify(originalData.references || [])) {
                                hasChanges = true;
                            }
                            
                            // Check team members
                            if (JSON.stringify(currentFormData.teamMembers) !== JSON.stringify(originalData.teamMembers || [])) {
                                hasChanges = true;
                            }
                        }
                        
                        if (!hasChanges) {
                            // No changes made - just close without saving
                            console.log('No changes detected, closing without save');
                            Swal.close();
                            renderApplicant();
                            return;
                        }
                        
                        // Has changes - ask if user wants to save
                        const result = await Swal.fire({
                            title: 'Save Changes?',
                            text: 'You have unsaved changes. Would you like to save them before closing?',
                            icon: 'question',
                            showCancelButton: true,
                            confirmButtonColor: '#D4AF37',
                            cancelButtonColor: '#6c757d',
                            confirmButtonText: 'Yes, Save',
                            cancelButtonText: 'No, Discard'
                        });
                        
                        if (result.isConfirmed) {
                            // Save changes
                            if (currentDraftData) {
                                Object.assign(currentDraftData, currentFormData);
                                currentDraftData.lastSaved = new Date().toISOString().slice(0, 10);
                                await saveDrafts();
                                showInlineNotification(modal, '📝 Changes saved!', true);
                            }
                        }
                        
                        // Close regardless
                        Swal.close();
                        renderApplicant();
                    } else {
                        // Fallback - just close
                        Swal.close();
                        renderApplicant();
                    }
                });
            }
                        
            // ========== SUBMIT BUTTON HANDLER ==========
            const submitBtn = modal.querySelector('#customSubmitBtn');
            if (submitBtn) {
                submitBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    e.preventDefault();

                    // Show loading state
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
                    
                    try {
                        let formData = collectFormData();
                        
                        const today = new Date();
                        const year = today.getFullYear();
                        const month = String(today.getMonth() + 1).padStart(2, '0');
                        const day = String(today.getDate()).padStart(2, '0');
                        const submissionDate = `${year}-${month}-${day}`;

                        const endorsementDateInput = modal.querySelector('#endorsementDate');
                        if (endorsementDateInput) {
                            endorsementDateInput.value = submissionDate;
                        }
                        formData.endorsementDate = submissionDate;
                        
                        clearAllHighlights(modal);
                        const activities = collectActivities();
                        if (!validateActivityDates(activities)) {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = isEditMode ? 'Update Application' : 'Submit Application';
                            return;
                        }
                        
                        const errors = validateAndHighlightFields(formData, modal);
                        if (errors.length > 0) {
                            scrollToFirstError(modal);
                            showFormNotification('Please complete all required fields (highlighted in red).', true, modal);
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = isEditMode ? 'Update Application' : 'Submit Application';
                            return;
                        }
                        
                        // ========== EDIT MODE (UPDATE EXISTING APPLICATION) ==========
                        if (isEditMode && editAppId) {
                            try {
                                // Get the existing application first
                                const response = await fetch(`${API_URL}/api/applications/${editAppId}`);
                                const existingApp = await response.json();
                                if (!response.ok) throw new Error(existingApp.error || 'Application not found');
                                
                                // Preserve existing signatures, CV statuses, and signature requests
                                const existingSignatures = existingApp.signatures || { chair: { signed: false }, dean: { signed: false } };
                                const existingPiCVStatus = existingApp.piCVStatus;
                                const existingTeamCVs = existingApp.teamCVs ? [...existingApp.teamCVs] : null;
                                const existingSubmittedDate = existingApp.submittedDate;
                                const existingSignatureRequests = existingApp.signatureRequests;
                                
                                // Create updated submission - KEEP signatures and CV statuses
                                const updatedSubmission = { 
                                    id: editAppId,
                                    grantTitle: selectedGrant,
                                    grantType: "Faculty Research Grant",
                                    status: existingApp.status, // Keep existing status
                                    submittedDate: existingSubmittedDate,
                                    signatures: existingSignatures, // Preserve signatures
                                    signatureRequests: existingSignatureRequests, // Preserve signature requests
                                    ...formData
                                };
                                
                                // Preserve CV statuses
                                if (existingPiCVStatus) updatedSubmission.piCVStatus = existingPiCVStatus;
                                if (existingTeamCVs) updatedSubmission.teamCVs = existingTeamCVs;
                                
                                console.log('Updating application:', updatedSubmission);
                                
                                // UPDATE via API
                                await KURO_API.updateApplication(editAppId, updatedSubmission);
                                
                                // Delete draft if it exists
                                if (editDraftId !== null) {
                                    const drafts = await KURO_API.getFacultyDrafts();
                                    const draftToDelete = drafts[editDraftId];
                                    if (draftToDelete?.draftId) {
                                        await KURO_API.deleteFacultyDraft(draftToDelete.draftId);
                                    }
                                    sessionStorage.removeItem('current_draft_id');
                                    editDraftId = null;
                                }
                                
                                await renderApplicant();
                                
                                await Swal.fire({
                                    icon: 'success',
                                    title: 'Updated!',
                                    text: 'Application updated successfully.',
                                    confirmButtonColor: '#D4AF37',
                                    timer: 2000,
                                    showConfirmButton: false
                                });
                                Swal.close();
                                return;
                                
                            } catch (error) {
                                console.error('Update failed:', error);
                                showFormNotification('Failed to update application: ' + error.message, true, modal);
                                submitBtn.disabled = false;
                                submitBtn.innerHTML = 'Update Application';
                                return;
                            }
                        }
                        
                        // ========== NEW SUBMISSION MODE ==========
                        if (!isEditMode || !editAppId) {
                            const newId = "FRG" + Date.now();
                            const newSubmission = { 
                                id: newId, 
                                grantTitle: selectedGrant, 
                                grantType: "Faculty Research Grant", 
                                status: "Awaiting Signatures",
                                submittedDate: new Date().toISOString().slice(0,10),
                                signatures: { chair: { signed: false }, dean: { signed: false } },
                                piCVStatus: 'pending',
                                userEmail: currentUser.email,
                                ...formData
                            };
                            
                            console.log('Creating new application:', newSubmission);
                            
                            // CREATE via API
                            const created = await KURO_API.createApplication(newSubmission);
                            console.log('Application created:', created);
                            
                            // Check if chair and dean emails exist
                            if (!formData.chairEmail || !formData.deanEmail) {
                                showFormNotification('⚠️ Please fill in Department Chair and Dean email addresses in Form 2.', true, modal);
                                submitBtn.disabled = false;
                                submitBtn.innerHTML = 'Submit Application';
                                return;
                            }
                            
                            // Generate signature links (try-catch separately so app isn't deleted)
                            try {
                                await autoGenerateSignatureLinks(created, created.id);
                                console.log('Signature links generated successfully');
                            } catch (sigError) {
                                console.error('Signature generation failed but application was saved:', sigError);
                                showFormNotification('⚠️ Application saved but signature emails failed. You can resend signatures later.', false, modal);
                            }
                            
                            // Delete draft if exists
                            if (editDraftId !== null) {
                                try {
                                    const drafts = await KURO_API.getFacultyDrafts();
                                    const draftToDelete = drafts[editDraftId];
                                    if (draftToDelete?.draftId) {
                                        await KURO_API.deleteFacultyDraft(draftToDelete.draftId);
                                    }
                                    sessionStorage.removeItem('current_draft_id');
                                    editDraftId = null;
                                } catch (draftError) {
                                    console.error('Error deleting draft:', draftError);
                                }
                            }
                            
                            await renderApplicant();
                            
                            await Swal.fire({
                                icon: 'success',
                                title: 'Submitted!',
                                text: 'Application submitted successfully!',
                                confirmButtonColor: '#D4AF37',
                                timer: 3000,
                                showConfirmButton: false
                            });
                            Swal.close();
                        }
                        
                    } catch (error) {
                        console.error('Submission failed:', error);
                        showFormNotification('Failed to submit: ' + error.message, true, modal);
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = isEditMode ? 'Update Application' : 'Submit Application';
                    }
                });
            }
            
            // ========== DRAFT BUTTON HANDLER ==========
            const draftBtn = modal.querySelector('#customDraftBtn');
            if (draftBtn) {
                draftBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    
                    if (isSubmittedEdit) {
                        showFormNotification('Please use "Update Application" to save changes to submitted applications.', true, modal);
                        return;
                    }
                    
                    const formData = await collectFormData();
                    
                    // Check if project title exists
                    if (!formData.proposalTitle || formData.proposalTitle.trim() === '') {
                        // Show modal asking for title
                        const result = await Swal.fire({
                            title: 'Project Title Required',
                            html: `
                                <div style="text-align: left;">
                                    <p>A project title is required to save your work as a draft.</p>
                                    <div class="form-group" style="margin-top: 1rem;">
                                        <label style="font-weight: 600; color: #0B2B4F;">Project Title <span style="color: #e74c3c;">*</span></label>
                                        <input type="text" id="draftTitleInput" class="swal2-input" placeholder="Enter project title" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #ddd;">
                                    </div>
                                </div>
                            `,
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#D4AF37',
                            cancelButtonColor: '#6c757d',
                            confirmButtonText: 'Save Draft',
                            cancelButtonText: 'Cancel',
                            didOpen: () => {
                                const titleInput = document.getElementById('draftTitleInput');
                                if (titleInput) {
                                    titleInput.focus();
                                    titleInput.addEventListener('keypress', (e) => {
                                        if (e.key === 'Enter') {
                                            Swal.clickConfirm();
                                        }
                                    });
                                }
                            },
                            preConfirm: () => {
                                const title = document.getElementById('draftTitleInput')?.value;
                                if (!title || title.trim() === '') {
                                    Swal.showValidationMessage('Project Title is required');
                                    return false;
                                }
                                return title;
                            }
                        });
                        
                        if (!result.isConfirmed) {
                            return; // User cancelled
                        }
                        
                        // Set the title from the modal
                        formData.proposalTitle = result.value;
                        
                        // Also update the DOM input
                        const titleField = modal.querySelector('#projTitle');
                        if (titleField) {
                            titleField.value = result.value;
                        }
                    }
                    
                    // Continue with saving the draft...
                    if (currentDraftData) {
                        Object.assign(currentDraftData, formData);
                        currentDraftData.grantTitle = selectedGrant;
                        currentDraftData.lastSaved = new Date().toISOString().slice(0, 10);
                        currentDraftData.lastSavedTime = new Date().toISOString();
                    } else {
                        currentDraftData = { ...formData, grantTitle: selectedGrant };
                    }
                    
                    let draftId = sessionStorage.getItem('current_draft_id');
                    if (!draftId) {
                        draftId = 'DRF_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
                        sessionStorage.setItem('current_draft_id', draftId);
                    }
                    currentDraftData.draftId = draftId;
                    currentDraftData.userEmail = currentUser.email;
                    
                    try {
                        await KURO_API.saveFacultyDraft(currentDraftData);
                        editDraftId = null; // Reset after save
                        showFormNotification('✓ Draft saved successfully!', false, modal);
                        
                        setTimeout(() => {
                            Swal.close();
                            renderApplicant();
                        }, 500);
                        
                    } catch (error) {
                        console.error('Failed to save draft:', error);
                        showFormNotification('❌ Failed to save draft. Please try again.', true, modal);
                    }
                });
            }
        }
    });
}

window.removeActivity = function(index) {
    const activities = collectActivities();
    
    if (activities.length === 1) {
        const activityCard = document.querySelector(`.activity-card[data-activity-index="${index}"]`);
        if (activityCard) {
            activityCard.querySelector('.act-name').value = '';
            activityCard.querySelector('.act-desc').value = '';
            activityCard.querySelector('.act-objective').value = '';
            activityCard.querySelector('.act-output').value = '';
            activityCard.querySelector('.act-start-date').value = '';
            const endDateInput = activityCard.querySelector('.act-end-date');
            endDateInput.value = '';
            endDateInput.disabled = true;
            
            const titleSpan = activityCard.querySelector('.activity-title');
            if (titleSpan) titleSpan.textContent = 'New Activity';
            
            showInlineNotification(null, 'Cannot remove the last activity. Cleared the fields instead.', false);
        }
    } else {
        const activityCard = document.querySelector(`.activity-card[data-activity-index="${index}"]`);
        if (activityCard) {
            activityCard.remove();
        }
        
        const remainingCards = document.querySelectorAll('.activity-card');
        remainingCards.forEach((card, newIdx) => {
            card.setAttribute('data-activity-index', newIdx);
            const titleSpan = card.querySelector('.activity-title');
            if (titleSpan) {
                titleSpan.textContent = `Activity ${newIdx + 1}`;
            }
            const removeBtn = card.querySelector('.remove-activity-btn');
            if (removeBtn) {
                removeBtn.setAttribute('onclick', `removeActivity(${newIdx})`);
            }
        });
        
        if (currentDraftData) {
            currentDraftData.activities = collectActivities();
            saveDrafts();
        }
    }
};

window.updateBudgetItemsList = function(selectElement) {

    if (!itemSelect) return;
    
    let options = '<option value="">Select Item</option>';
    if (category && subcategory && BUDGET_STRUCTURE[category] && BUDGET_STRUCTURE[category][subcategory]) {

        updateBudgetGrandTotalDisplay();
    }

function collectBudgetItemsFromDOM() {
    const items = [];
    const budgetCards = document.querySelectorAll('.budget-card');
    budgetCards.forEach(card => {
        items.push({
            category: card.querySelector('.budget-category')?.value || '',
            subcategory: card.querySelector('.budget-subcategory')?.value || '',
            itemName: card.querySelector('.budget-item-select')?.value || '',
            specs: card.querySelector('.budget-specs')?.value || '',
            unitCost: parseFloat(card.querySelector('.budget-unit-cost')?.value) || 0,
            qty: parseFloat(card.querySelector('.budget-qty')?.value) || 1
        });
    });
    return items;
}

        newCardHtml += '<div class="budget-row-item">';
        newCardHtml += '<label>Total</label>';
        newCardHtml += '<div class="budget-total-display" id="budgetTotalDisplay_' + newIndex + '">₱0</div>';
        newCardHtml += '</div>';
        newCardHtml += '</div>';
        newCardHtml += '</div>';
        
        const addButton = container.querySelector('.add-budget-btn');
        if (addButton) {
            addButton.insertAdjacentHTML('beforebegin', newCardHtml);
        } else {
            container.insertAdjacentHTML('beforeend', newCardHtml);
        }
        
        if (currentDraftData) {
            currentDraftData.budgetItems = collectBudgetItemsFromDOM();
            saveDrafts();
        }
        
        updateBudgetGrandTotalDisplay();
    }
};

window.removeBudgetItem = function(index) {
    const budgetCards = document.querySelectorAll('.budget-card');
    
    if (budgetCards.length === 1) {
        const budgetCard = budgetCards[0];
        if (budgetCard) {
            budgetCard.querySelector('.budget-category').value = '';
            const subcatSelect = budgetCard.querySelector('.budget-subcategory');
            if (subcatSelect) subcatSelect.innerHTML = '<option value="">Select Subcategory</option>';
            const itemSelect = budgetCard.querySelector('.budget-item-select');
            if (itemSelect) itemSelect.innerHTML = '<option value="">Select Item</option>';
            const specsInput = budgetCard.querySelector('.budget-specs');
            if (specsInput) specsInput.value = '';
            const unitCostInput = budgetCard.querySelector('.budget-unit-cost');
            if (unitCostInput) unitCostInput.value = '';
            const qtyInput = budgetCard.querySelector('.budget-qty');
            if (qtyInput) qtyInput.value = 1;
            const totalDisplay = budgetCard.querySelector('.budget-total-display');
            if (totalDisplay) totalDisplay.textContent = '₱0';
            
            const titleSpan = budgetCard.querySelector('.budget-card-title');
            if (titleSpan) titleSpan.textContent = 'New Budget';
        }
        
        if (currentDraftData) {
            currentDraftData.budgetItems = collectBudgetItemsFromDOM();
            saveDrafts();
        }
        
        showInlineNotification(null, 'Cannot remove the last budget item. Clear the fields instead.', false);
        updateBudgetGrandTotalDisplay();
        return;
    }
    
    const budgetCard = document.querySelector(`.budget-card[data-budget-index="${index}"]`);
    if (budgetCard) {
        budgetCard.remove();
    }
    
    const remainingCards = document.querySelectorAll('.budget-card');
    remainingCards.forEach((card, newIdx) => {
        card.setAttribute('data-budget-index', newIdx);
        
        const titleSpan = card.querySelector('.budget-card-title');
        if (titleSpan) {
            titleSpan.textContent = `Budget ${newIdx + 1}`;
        }
        
        card.querySelectorAll('[data-index]').forEach(el => {
            el.setAttribute('data-index', newIdx);
        });
        
        const removeBtn = card.querySelector('.budget-card-remove');
        if (removeBtn) {
            removeBtn.setAttribute('onclick', `removeBudgetItem(${newIdx})`);
        }
        
        const totalDisplay = card.querySelector('.budget-total-display');
        if (totalDisplay) {
            totalDisplay.id = `budgetTotalDisplay_${newIdx}`;
        }
        
        const unitCostInput = card.querySelector('.budget-unit-cost');
        if (unitCostInput) {
            unitCostInput.setAttribute('oninput', `updateBudgetItemTotal(${newIdx})`);
        }
        
        const qtyInput = card.querySelector('.budget-qty');
        if (qtyInput) {
            qtyInput.setAttribute('oninput', `updateBudgetItemTotal(${newIdx})`);
        }
        
        const categorySelect = card.querySelector('.budget-category');
        if (categorySelect) {
            categorySelect.setAttribute('onchange', `updateBudgetSubcategories(this)`);
        }
        
        const subcategorySelect = card.querySelector('.budget-subcategory');
        if (subcategorySelect) {
            subcategorySelect.setAttribute('onchange', `updateBudgetItemsList(this)`);
        }
        
        const itemSelect = card.querySelector('.budget-item-select');
        if (itemSelect) {
            itemSelect.setAttribute('onchange', `updateBudgetItemName(this)`);
        }
        
        const specsInput = card.querySelector('.budget-specs');
        if (specsInput) {
            specsInput.setAttribute('onchange', `updateBudgetSpecs(this)`);
        }
    });
    
    if (currentDraftData) {
        currentDraftData.budgetItems = collectBudgetItemsFromDOM();
        saveDrafts();
    }
    
    updateBudgetGrandTotalDisplay();
};

function updateBudgetGrandTotalDisplay() {
    let grandTotal = 0;
    const unitCostInputs = document.querySelectorAll('.budget-unit-cost');
    const qtyInputs = document.querySelectorAll('.budget-qty');
    
    for (let i = 0; i < unitCostInputs.length; i++) {
        const unitCost = parseFloat(unitCostInputs[i]?.value) || 0;
        const qty = parseFloat(qtyInputs[i]?.value) || 1;
        grandTotal += unitCost * qty;
    }
    
    const summaryCard = document.querySelector('.budget-summary-card');
    if (summaryCard) {
        summaryCard.innerHTML = `
            <div class="budget-summary-grand" style="justify-content: space-between; display: flex;">
                <span><i class="fas fa-calculator"></i> GRAND TOTAL:</span>
                <span>₱${grandTotal.toLocaleString()}</span>
            </div>
        `;
    }
}

window.updateSubcategories = updateSubcategories;
window.updateSubSubcategories = updateSubSubcategories;
window.updateBudgetTotals = updateBudgetTotals;
