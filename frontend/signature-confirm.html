<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signature Confirmation | KURO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #e8ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .signature-card {
            background: white;
            border-radius: 2rem;
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        .signature-icon {
            width: 80px;
            height: 80px;
            background: #283871;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .signature-icon i {
            font-size: 2.5rem;
            color: #D4AF37;
        }
        h1 {
            color: #283871;
            margin-bottom: 0.5rem;
        }
        .application-details {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 1rem;
            margin: 1.5rem 0;
            text-align: left;
        }
        .signature-field {
            border: 2px solid #e0e0e0;
            border-radius: 1rem;
            padding: 1rem;
            margin: 1rem 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .signature-field:hover {
            border-color: #D4AF37;
            background: #fffef5;
        }
        .signature-field.signed {
            background: #e0f5e6;
            border-color: #2ecc71;
        }
        .btn-confirm {
            background: #D4AF37;
            color: #283871;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.2s;
        }
        .btn-confirm:hover {
            background: #b8942e;
            color: white;
        }
        .btn-confirm:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        .status-badge.pending { background: #fff0db; color: #b45f1b; }
        .status-badge.signed { background: #e0f5e6; color: #1e6f3f; }
        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #999;
        }
    </style>
</head>
<body>
<div class="signature-card" id="signatureCard">
    <div class="signature-icon">
        <i class="fas fa-signature"></i>
    </div>
    <h1>Digital Signature Request</h1>
    <p>You have been requested to digitally sign an endorsement letter for a research grant application.</p>
    
    <div class="application-details" id="appDetails"></div>
    
    <h3>Your Signature</h3>
    <div class="signature-field" id="signatureField">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span><i class="fas fa-pen"></i> Click to sign digitally</span>
            <span class="status-badge pending" id="signatureStatus">Pending</span>
        </div>
    </div>
    
    <button class="btn-confirm" id="confirmBtn">✍️ Confirm & Sign</button>
    <footer><i class="fas fa-lock"></i> This is a legally binding digital signature</footer>
</div>

<script>
    const API_URL = 'https://kuro-api-m4mb.onrender.com';
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const role = urlParams.get('role'); // chair, dean, coordinator
    const appId = urlParams.get('id');
    
    // Load signature requests from localStorage
    let signatureRequests = JSON.parse(localStorage.getItem('kuro_signature_requests')) || {};
    
    const request = signatureRequests[token];
    
    if (!request || request.appId !== appId) {
        document.getElementById('signatureCard').innerHTML = `
            <div class="signature-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h1>Invalid or Expired Link</h1>
            <p>This signature request link is invalid or has already been used.</p>
            <p>Please contact the KURO office for assistance.</p>
        `;
    } else {
        // Display application details
        const app = request.application;
        document.getElementById('appDetails').innerHTML = `
            <strong>Project Title:</strong> ${escapeHtml(app.proposalTitle || app.projectTitle || 'N/A')}<br>
            <strong>Principal Investigator:</strong> ${escapeHtml(app.piName || 'N/A')}<br>
            <strong>Grant:</strong> ${escapeHtml(app.grantTitle)}<br>
            <strong>Your Role:</strong> ${role === 'chair' ? 'Department Chair' : (role === 'dean' ? 'Dean' : 'Research Coordinator')}
        `;
        
        let isSigned = false;
        
        document.getElementById('signatureField').addEventListener('click', function() {
            if (!isSigned) {
                this.classList.add('signed');
                document.getElementById('signatureStatus').innerText = 'Signed';
                document.getElementById('signatureStatus').className = 'status-badge signed';
                isSigned = true;
            }
        });
        
        document.getElementById('confirmBtn').addEventListener('click', function() {
            if (!isSigned) {
                alert('Please click the signature field to sign first.');
                return;
            }
            
            // Update the signature status in localStorage
            const submissionsDB = JSON.parse(localStorage.getItem('kuro_submissions')) || {};
            for (let email in submissionsDB) {
                const apps = submissionsDB[email];
                if (Array.isArray(apps)) {
                    for (let i = 0; i < apps.length; i++) {
                        if (apps[i].id === appId) {
                            if (!apps[i].signatures) apps[i].signatures = {};
                            apps[i].signatures[role] = {
                                signed: true,
                                signedDate: new Date().toISOString(),
                                signerEmail: request.signerEmail,
                                signerName: request.signerName
                            };
                            submissionsDB[email] = apps;
                            localStorage.setItem('kuro_submissions', JSON.stringify(submissionsDB));
                            break;
                        }
                    }
                }
            }
            
            // Mark request as completed
            signatureRequests[token].completed = true;
            localStorage.setItem('kuro_signature_requests', JSON.stringify(signatureRequests));
            
            // Show success message
            document.getElementById('signatureCard').innerHTML = `
                <div class="signature-icon"><i class="fas fa-check-circle"></i></div>
                <h1>Thank You!</h1>
                <p>You have successfully signed the endorsement letter.</p>
                <p>The application will now reflect your digital signature.</p>
                <button class="btn-confirm" onclick="window.close()">Close Window</button>
            `;
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
