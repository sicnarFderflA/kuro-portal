async function resetCheckStage(appId, stage) {
    // stage can be 'check1', 'check2', or 'check3'
    
    let titleText = '';
    let confirmText = '';
    let resetData = {};
    
    switch(stage) {
        case 'check1':
            titleText = 'Reset Check 1 (Eligibility Review)?';
            confirmText = 'Yes, reset Check 1 and all subsequent checks';
            resetData = {
                status: 'Pending Eligibility Check',
                check1CompletedAt: null,
                check1Feedback: null,
                check2CompletedAt: null,
                check2Feedback: null,
                check3CompletedAt: null,
                check3Feedback: null,
                assignedReviewers: null  // Also clear external reviewers
            };
            break;
        case 'check2':
            titleText = 'Reset Check 2 (Secondary Review)?';
            confirmText = 'Yes, reset Check 2 and subsequent checks';
            resetData = {
                status: 'Pending Secondary Check',
                check2CompletedAt: null,
                check2Feedback: null,
                check3CompletedAt: null,
                check3Feedback: null
            };
            break;
        case 'check3':
            titleText = 'Reset Final Approval (Check 3)?';
            confirmText = 'Yes, reset final approval';
            resetData = {
                status: 'Pending Final Check',
                check3CompletedAt: null,
                check3Feedback: null
            };
            break;
        default:
            return;
    }
    
    const result = await Swal.fire({
        title: titleText,
        html: `<div style="text-align: left;">
            <p>This will:</p>
            <ul>
                <li>Reset the ${stage.toUpperCase()} approval status</li>
                <li>Move the application back to ${stage === 'check1' ? 'Eligibility Review (Check 1)' : (stage === 'check2' ? 'Secondary Review (Check 2)' : 'Final Review (Check 3)')}</li>
                ${stage === 'check1' ? '<li>Reset all subsequent checks (Check 2 and Check 3)</li>' : ''}
                ${stage === 'check2' ? '<li>Reset Check 3 (Final Review)</li>' : ''}
                ${stage === 'check1' ? '<li>Remove all assigned external reviewers</li>' : ''}
            </ul>
            <p class="demo-note" style="margin-top: 1rem; background: #fff3cd;">
                <i class="fas fa-exclamation-triangle"></i> This action cannot be undone. The faculty will be notified.
            </p>
        </div>`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#e74c3c',
        confirmButtonText: confirmText,
        cancelButtonText: 'Cancel'
    });
    
    if (!result.isConfirmed) return;
    
    try {
        // First, get the current application to get faculty email
        const response = await fetch(`${API_URL}/api/applications/${appId}`);
        const app = await response.json();
        
        // Call API to reset the stage
        await KURO_API.resetCheckStage(appId, resetData);
        
        // Add notification to faculty
        await KURO_API.createNotification({
            userEmail: app.userEmail,
            type: 'stage_reset',
            title: '🔄 Review Stage Reset',
            message: `Your application "${app.proposalTitle?.substring(0, 50)}" has been sent back for ${stage === 'check1' ? 'Eligibility Review' : (stage === 'check2' ? 'Secondary Review' : 'Final Review')}. Please address any feedback.`,
            appId: appId,
            icon: '🔄',
            color: '#f39c12'
        });
        
        showToast(`${stage.toUpperCase()} reset successfully`, 'success');
        renderDashboard();
        
    } catch (error) {
        console.error('Reset failed:', error);
        showToast('Failed to reset stage: ' + (error.message || 'Unknown error'), 'error');
    }
}

                <td><span style="background: var(--primary); color: white; padding: 0.2rem 0.6rem; border-radius: 20px;">${roleNames[email.role] || email.role}</span></td>

            </tr>
        `).join('');
    };
    
    const modalHtml = `
        <div style="max-height: 70vh; overflow-y: auto; padding-right: 0.5rem;">
            <div style="display: flex; gap: 0.5rem; border-bottom: 2px solid #eef2f0; margin-bottom: 1.5rem; flex-wrap: wrap; padding: 0 0.5rem;">
                <button class="settings-tab-btn active" data-tab="superadmins" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.2rem; background: none; border: none; cursor: pointer; font-weight: 600; color: var(--primary); border-bottom: 3px solid var(--gold);"><i class="fas fa-crown"></i> Super Admins</button>
                <button class="settings-tab-btn" data-tab="admins" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.2rem; background: none; border: none; cursor: pointer; font-weight: 600; color: #666; border-bottom: 3px solid transparent;"><i class="fas fa-user-shield"></i> Admin Users</button>
                <button class="settings-tab-btn" data-tab="checkers" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.2rem; background: none; border: none; cursor: pointer; font-weight: 600; color: #666; border-bottom: 3px solid transparent;"><i class="fas fa-check-double"></i> Checker Roles</button>
                <button class="settings-tab-btn" data-tab="reviewers" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.2rem; background: none; border: none; cursor: pointer; font-weight: 600; color: #666; border-bottom: 3px solid transparent;"><i class="fas fa-users"></i> Reviewers Pool</button>
                <button class="settings-tab-btn" data-tab="audit" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.2rem; background: none; border: none; cursor: pointer; font-weight: 600; color: #666; border-bottom: 3px solid transparent;"><i class="fas fa-history"></i> Audit Log</button>
                <button class="settings-tab-btn" data-tab="testaccounts" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.2rem; background: none; border: none; cursor: pointer; font-weight: 600; color: #666; border-bottom: 3px solid transparent;"><i class="fas fa-vial"></i> Test Accounts</button>
            </div>
            
            <div id="tabSuperadmins" class="settings-tab-pane" style="display: block;">
                <div class="settings-card"><div class="settings-card-header"><i class="fas fa-crown"></i> Super Admin Accounts</div><div class="settings-card-body">
                    <div class="add-item-bar">
                        <input type="email" id="newSuperAdminEmail" placeholder="email@xu.edu.ph" autocomplete="off">
                        <button id="addSuperAdminBtn" class="btn-primary"><i class="fas fa-plus"></i> Add</button>
                    </div>
                    <table class="settings-table"><thead><tr><th>Email</th><th>Actions</th></tr></thead><tbody id="superAdminsList">${superAdmins.map(email => `<tr><td>${escapeHtml(email)}</td><td><button class="remove-superadmin-btn btn-danger" data-email="${escapeHtml(email)}">Remove</button></td></tr>`).join('')}${superAdmins.length === 0 ? '<tr><td colspan="2" class="empty-state">No super admins</td></tr>' : ''}</tbody></table>
                </div></div></div>
            
            <div id="tabAdmins" class="settings-tab-pane" style="display: none;">
                <div class="settings-card"><div class="settings-card-header"><i class="fas fa-user-shield"></i> Admin Users</div><div class="settings-card-body">
                    <div class="add-item-bar">
                        <input type="email" id="newAdminEmail" placeholder="email@xu.edu.ph" autocomplete="off">
                        <button id="addAdminBtn" class="btn-primary"><i class="fas fa-plus"></i> Add</button>
                    </div>
                    <table class="settings-table"><thead><tr><th>Email</th><th>Actions</th></tr></thead><tbody id="adminsList">${adminEmails.map(email => `<tr><td>${escapeHtml(email)}</td><td><button class="remove-admin-btn btn-danger" data-email="${escapeHtml(email)}">Remove</button></td></tr>`).join('')}${adminEmails.length === 0 ? '<tr><td colspan="2" class="empty-state">No admin users</td></tr>' : ''}</tbody></table>
                </div></div></div>
            
            <div id="tabCheckers" class="settings-tab-pane" style="display: none;">
                <div class="settings-card"><div class="settings-card-header"><i class="fas fa-check-double"></i> Checker Roles</div><div class="settings-card-body">
                    <table class="settings-table"><thead><tr><th>Stage</th><th>Assigned Admin</th><th>Action</th></tr></thead><tbody>
                        <tr><td><strong>🔍 Check 1</strong><br><small>Eligibility Review</small></td><td><select id="roleSelect_check1" class="role-select"><option value="">-- Select --</option>${adminEmails.map(e => `<option value="${e}" ${checkerRoles.check1 === e ? 'selected' : ''}>${e}</option>`).join('')}</select></td><td><button class="save-role-btn btn-primary" data-role="check1">Save</button></td></tr>
                        <tr><td><strong>📋 Check 2</strong><br><small>Secondary Review</small></td><td><select id="roleSelect_check2" class="role-select"><option value="">-- Select --</option>${adminEmails.map(e => `<option value="${e}" ${checkerRoles.check2 === e ? 'selected' : ''}>${e}</option>`).join('')}</select></td><td><button class="save-role-btn btn-primary" data-role="check2">Save</button></td></tr>
                        <tr><td><strong>✅ Check 3</strong><br><small>Final Review</small></td><td><select id="roleSelect_check3" class="role-select"><option value="">-- Select --</option>${adminEmails.map(e => `<option value="${e}" ${checkerRoles.check3 === e ? 'selected' : ''}>${e}</option>`).join('')}</select></td><td><button class="save-role-btn btn-primary" data-role="check3">Save</button></td></tr>
                    </tbody></table>
                </div></div></div>
            
            <div id="tabReviewers" class="settings-tab-pane" style="display: none;">
                <div class="settings-card"><div class="settings-card-header"><i class="fas fa-users"></i> External Reviewers Pool</div><div class="settings-card-body">
                    <div class="add-item-bar">
                        <input type="email" id="newReviewerEmail" placeholder="reviewer@xu.edu.ph" autocomplete="off">
                        <input type="text" id="newReviewerName" placeholder="Full Name (optional)" autocomplete="off">
                        <button id="addReviewerBtn" class="btn-primary"><i class="fas fa-plus"></i> Add</button>
                    </div>
                    <table class="settings-table"><thead><tr><th>Email</th><th>Name</th><th>Actions</th></tr></thead><tbody id="reviewersList">${externalReviewers.map(r => `<tr><td>${escapeHtml(r.email)}</td><td>${escapeHtml(r.name || '')}</td><td><button class="remove-reviewer-pool-btn btn-danger" data-email="${escapeHtml(r.email)}">Remove</button></td></tr>`).join('')}${externalReviewers.length === 0 ? '<tr><td colspan="3" class="empty-state">No external reviewers</td></tr>' : ''}</tbody></table>
                </div></div></div>
            
            <div id="tabAudit" class="settings-tab-pane" style="display: none;">
                <div class="settings-card"><div class="settings-card-header"><i class="fas fa-history"></i> Audit Log</div><div class="settings-card-body" style="max-height: 500px; overflow-y: auto;">
                    ${auditLogs.map(log => `<div class="audit-item"><div><strong>${escapeHtml(log.action)}</strong> by ${escapeHtml(log.performedBy)}</div><div class="time">${new Date(log.timestamp).toLocaleString()}</div><div class="details">${JSON.stringify(log.changes)}</div></div>`).join('')}
                    ${auditLogs.length === 0 ? '<div class="empty-state">No audit logs available</div>' : ''}
                </div></div></div>
            
            <div id="tabTestaccounts" class="settings-tab-pane" style="display: none;">
                <div class="settings-card"><div class="settings-card-header"><i class="fas fa-vial"></i> Test Email Accounts</div>
                <div class="settings-card-body">
                    <div class="add-item-bar">
                        <input type="email" id="newTestEmail" placeholder="test@example.com" autocomplete="off" style="flex: 2;">
                        <select id="newTestRole" style="padding: 0.6rem 1rem; border: 1px solid #ddd; border-radius: 40px;">
                            <option value="student">Student</option>
                            <option value="faculty">Faculty</option>
                            <option value="admin">Admin</option>
                            <option value="check1">Check 1</option>
                            <option value="check2">Check 2</option>
                            <option value="check3">Check 3</option>
                        </select>
                        <input type="text" id="newTestName" placeholder="Name (optional)" autocomplete="off" style="flex: 1;">
                        <button id="addTestEmailBtn" class="btn-primary"><i class="fas fa-plus"></i> Add</button>
                    </div>
                    <table class="settings-table">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="testEmailsList">
                            ${renderTestEmailsTable()}
                        </tbody>
                    </table>
                    <div class="demo-note" style="margin-top: 1rem;">
                        <i class="fas fa-info-circle"></i> Test emails can log in without domain restrictions. Useful for testing different roles.
                    </div>
                </div>
            </div>
        </div>
    `;
    
    const result = await Swal.fire({
        title: '<i class="fas fa-shield-alt"></i> System Administration',
        html: modalHtml,
        width: '950px',
        showConfirmButton: true,
        confirmButtonText: 'Close',
        confirmButtonColor: '#D4AF37',
        didOpen: (modal) => {
            const tabBtns = modal.querySelectorAll('.settings-tab-btn');
            const tabPanes = modal.querySelectorAll('.settings-tab-pane');
            
            function switchTab(tabId) {
                tabPanes.forEach(pane => pane.style.display = 'none');
                const selectedPane = modal.querySelector(`#tab${tabId.charAt(0).toUpperCase() + tabId.slice(1)}`);
                if (selectedPane) selectedPane.style.display = 'block';
                tabBtns.forEach(btn => {
                    const btnTabId = btn.getAttribute('data-tab');
                    if (btnTabId === tabId) {
                        btn.style.color = 'var(--primary)';
                        btn.style.borderBottom = '3px solid var(--gold)';
                    } else {
                        btn.style.color = '#666';
                        btn.style.borderBottom = '3px solid transparent';
                    }
                });
            }
            
            tabBtns.forEach(btn => btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab'))));
            
            // Add Super Admin
            modal.querySelector('#addSuperAdminBtn')?.addEventListener('click', async () => {
                const email = modal.querySelector('#newSuperAdminEmail').value;
                if (!email) { Swal.fire('Error', 'Please enter an email', 'error'); return; }
                try {
                    await KURO_API.addSuperAdmin(email);
                    showToast(`Added ${email} as Super Admin`, 'success');
                    modal.querySelector('#newSuperAdminEmail').value = '';
                    Swal.close();
                    openSuperuserSettings();
                } catch (error) { showToast('Failed to add', 'error'); }
            });
            
            modal.querySelectorAll('.remove-superadmin-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const email = btn.getAttribute('data-email');
                    const result = await Swal.fire({ title: 'Remove Super Admin?', text: `Remove ${email}?`, icon: 'warning', showCancelButton: true });
                    if (result.isConfirmed) {
                        await KURO_API.removeSuperAdmin(email);
                        showToast(`Removed ${email}`, 'success');
                        Swal.close();
                        openSuperuserSettings();
                    }
                });
            });
            
            // Add Admin
            modal.querySelector('#addAdminBtn')?.addEventListener('click', async () => {
                const email = modal.querySelector('#newAdminEmail').value;
                if (!email) { Swal.fire('Error', 'Please enter an email', 'error'); return; }
                try {
                    await KURO_API.addAdmin(email);
                    showToast(`Added ${email} as Admin`, 'success');
                    modal.querySelector('#newAdminEmail').value = '';
                    Swal.close();
                    openSuperuserSettings();
                } catch (error) { showToast('Failed to add', 'error'); }
            });
            
            modal.querySelectorAll('.remove-admin-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const email = btn.getAttribute('data-email');
                    const result = await Swal.fire({ title: 'Remove Admin?', text: `Remove ${email}?`, icon: 'warning', showCancelButton: true });
                    if (result.isConfirmed) {
                        await KURO_API.removeAdmin(email);
                        showToast(`Removed ${email}`, 'success');
                        Swal.close();
                        openSuperuserSettings();
                    }
                });
            });
            
            // Save Checker Roles
            modal.querySelectorAll('.save-role-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const role = btn.getAttribute('data-role');
                    const select = modal.querySelector(`#roleSelect_${role}`);
                    const email = select.value;
                    let roles = { check1: checkerRoles.check1, check2: checkerRoles.check2, check3: checkerRoles.check3 };
                    roles[role] = email;
                    try {
                        await KURO_API.updateCheckerRoles(roles);
                        showToast(`Updated ${role.toUpperCase()} assignment`, 'success');
                        Swal.close();
                        openSuperuserSettings();
                    } catch (error) { showToast('Failed to update', 'error'); }
                });
            });
            
            // Add External Reviewer
            modal.querySelector('#addReviewerBtn')?.addEventListener('click', async () => {
                const email = modal.querySelector('#newReviewerEmail').value;
                const name = modal.querySelector('#newReviewerName').value;
                if (!email) { Swal.fire('Error', 'Please enter an email', 'error'); return; }
                try {
                    await KURO_API.addExternalReviewerToPool(email, name);
                    showToast(`Added ${email} to reviewers pool`, 'success');
                    modal.querySelector('#newReviewerEmail').value = '';
                    modal.querySelector('#newReviewerName').value = '';
                    Swal.close();
                    openSuperuserSettings();
                } catch (error) { showToast('Failed to add', 'error'); }
            });
            
            modal.querySelectorAll('.remove-reviewer-pool-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const email = btn.getAttribute('data-email');
                    const result = await Swal.fire({ title: 'Remove Reviewer?', text: `Remove ${email} from pool?`, icon: 'warning', showCancelButton: true });
                    if (result.isConfirmed) {
                        await KURO_API.removeExternalReviewerFromPool(email);
                        showToast(`Removed ${email}`, 'success');
                        Swal.close();
                        openSuperuserSettings();
                    }
                });
            });
            
            // ========== TEST EMAILS HANDLERS ==========
            // Add Test Email
            modal.querySelector('#addTestEmailBtn')?.addEventListener('click', async () => {
                const email = modal.querySelector('#newTestEmail').value;
                const role = modal.querySelector('#newTestRole').value;
                const name = modal.querySelector('#newTestName').value;
                
                if (!email) {
                    Swal.fire('Error', 'Please enter an email address', 'error');
                    return;
                }
                
                try {
                    await KURO_API.addTestEmail(email, role, name, '');
                    showToast(`Added ${email} as test ${role} account`, 'success');
                    modal.querySelector('#newTestEmail').value = '';
                    modal.querySelector('#newTestName').value = '';
                    Swal.close();
                    openSuperuserSettings();
                } catch (error) {
                    showToast('Failed to add test email', 'error');
                }
            });
            
            // Remove Test Email
            modal.querySelectorAll('.remove-test-email-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.getAttribute('data-id');
                    const emailText = btn.getAttribute('data-email');
                    const result = await Swal.fire({ title: 'Remove Test Email?', text: `Remove ${emailText}?`, icon: 'warning', showCancelButton: true });
                    if (result.isConfirmed) {
                        await KURO_API.deleteTestEmail(id);
                        showToast(`Removed ${emailText}`, 'success');
                        Swal.close();
                        openSuperuserSettings();
                    }
                });
            });
        }
    });
}

// Initialize
const superuserBtn = document.getElementById('superuserSettingsBtn');
if (superuserBtn && isSuperAdmin) {
    superuserBtn.style.display = 'inline-flex';
    superuserBtn.addEventListener('click', openSuperuserSettings);
}

initNotificationSystem();
loadCheckerRoles();
renderDashboard();
document.getElementById('logoutBtn').onclick = () => { sessionStorage.clear(); window.location.href = "login.html"; };
</script>
