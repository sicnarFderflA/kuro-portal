function viewReviewerEvaluation(reviewerEmail, reviewerName, evaluationType, appData) {
    // Only exempt your specific test email
    const EXEMPTED_TEST_EMAIL = '200520181@my.xu.edu.ph';
    const EXEMPTED_FACULTY_EMAIL = '200520181@xu.edu.ph';
    
    function emailsMatch(email1, email2) {
        if (!email1 || !email2) return false;
        // Direct match
        if (email1 === email2) return true;
        // Exempted test email match (only for 200520181)
        if ((email1 === EXEMPTED_TEST_EMAIL && email2 === EXEMPTED_FACULTY_EMAIL) ||
            (email1 === EXEMPTED_FACULTY_EMAIL && email2 === EXEMPTED_TEST_EMAIL)) {
            return true;
        }
        return false;
    }
    
    // Handle case where no review exists
    if (evaluationType === 'none') {
        Swal.fire({
            icon: 'info',
            title: 'No Review Submitted',
            html: `<div class="detail-section">
                <h4>${escapeHtml(reviewerName)}</h4>
                <p><strong>Email:</strong> ${escapeHtml(reviewerEmail)}</p>
                <p style="margin-top: 1rem;">This reviewer has not submitted any evaluation yet.</p>
                <p style="margin-top: 1rem; padding: 0.8rem; background: #f8f9fa; border-radius: 8px;">
                    <i class="fas fa-clock"></i> Once they submit their review, it will appear here.
                </p>
            </div>`,
            confirmButtonColor: '#D4AF37',
            confirmButtonText: 'Close'
        });
        return;
    }
    
    let feedback = null;
    let title = '';
    
    // Find feedback by email matching (with exemption for test email)
    if (evaluationType === 'final') {
        if (appData.finalReportReview?.reviewerFeedbacks) {
            for (let email in appData.finalReportReview.reviewerFeedbacks) {
                if (emailsMatch(reviewerEmail, email)) {
                    feedback = appData.finalReportReview.reviewerFeedbacks[email];
                    break;
                }
            }
        }
        title = `📋 Final Report Review from ${reviewerName}`;
    } else {
        if (appData.reviewerFeedbacks) {
            for (let email in appData.reviewerFeedbacks) {
                if (emailsMatch(reviewerEmail, email)) {
                    feedback = appData.reviewerFeedbacks[email];
                    break;
                }
            }
        }
        title = `📝 Initial Review from ${reviewerName}`;
    }
    
    if (!feedback) {
        Swal.fire({ 
            icon: 'info', 
            title: 'No Review', 
            text: 'This reviewer has not submitted an evaluation yet.', 
            confirmButtonColor: '#D4AF37' 
        });
        return;
    }
    
    let html = `<div style="max-height: 60vh; overflow-y: auto;">`;
    
    // Check if this is a final report review (has evaluations object)
    if (feedback.evaluations) {
        // Final Report Review (FORM G style)
        html += `
            <div class="detail-section" style="background: linear-gradient(135deg, #283871 0%, #1e2b57 100%); color: white;">
                <h4 style="color: var(--gold);">📋 Final Report Review</h4>
                <div><strong>Reviewer:</strong> ${escapeHtml(feedback.reviewerName || reviewerName)}</div>
                <div><strong>Email:</strong> ${escapeHtml(reviewerEmail)}</div>
                <div><strong>Submitted:</strong> ${new Date(feedback.submittedDate).toLocaleString()}</div>
                <div><strong>Recommendation:</strong> ${feedback.recommendation || 'N/A'}</div>
            </div>
        `;
        
        // Show evaluation criteria summary if available
        if (feedback.evaluations) {
            html += `<div class="detail-section">
                <h4><i class="fas fa-check-double"></i> Evaluation Summary</h4>
                <table style="width: 100%; font-size: 0.75rem; border-collapse: collapse;">
                    <thead><tr style="background: #f0f0f0;"><th style="padding: 0.5rem; text-align: left;">Section</th><th style="padding: 0.5rem; text-align: center;">Rated</th><th style="padding: 0.5rem; text-align: center;">Total</th><th style="padding: 0.5rem; text-align: left;">Status</th></tr></thead>
                    <tbody>`;
            
            for (let [sectionId, sectionData] of Object.entries(feedback.evaluations)) {
                const rated = sectionData.ratings?.filter(r => r === 'yes' || r === 'no' || r === 'partial').length || 0;
                const total = sectionData.ratings?.length || 0;
                const status = rated === total ? '✅ Complete' : (rated > 0 ? '⚠️ Partial' : '❌ Not Started');
                const sectionName = sectionId.charAt(0).toUpperCase() + sectionId.slice(1);
                html += `<tr><td style="padding: 0.4rem;">${escapeHtml(sectionName)}</td>
                          <td style="padding: 0.4rem; text-align: center;">${rated}</td>
                          <td style="padding: 0.4rem; text-align: center;">${total}</td>
                          <td style="padding: 0.4rem;">${status}</td>
                        </tr>`;
            }
            html += `</tbody>}</div>`;
        }
        
        // Narrative Feedback
        if (feedback.narrativeFeedback) {
            html += `<div class="detail-section">
                <h4><i class="fas fa-comment-dots"></i> Narrative Feedback for Author/s</h4>
                <div style="background: #f8f9fa; padding: 0.8rem; border-radius: 0.5rem; white-space: pre-wrap;">${escapeHtml(feedback.narrativeFeedback)}</div>
            </div>`;
        }
        
        // Revision reasons
        if (feedback.revisionReasons && feedback.revisionReasons.length) {
            html += `<div class="detail-section">
                <h4><i class="fas fa-edit"></i> Revision Reasons</h4>
                <ul>`;
            feedback.revisionReasons.forEach(reason => {
                html += `<li>${escapeHtml(reason)}</li>`;
            });
            html += `</ul></div>`;
        }
        
    } else {
        // Initial Review (Proposal Review)
        html += `
            <div class="detail-section" style="background: linear-gradient(135deg, #283871 0%, #1e2b57 100%); color: white;">
                <h4 style="color: var(--gold);">📝 Initial Proposal Review</h4>
                <div><strong>Reviewer:</strong> ${escapeHtml(feedback.reviewerName || reviewerName)}</div>
                <div><strong>Email:</strong> ${escapeHtml(reviewerEmail)}</div>
                <div><strong>Submitted:</strong> ${new Date(feedback.submittedDate).toLocaleString()}</div>
            </div>
        `;
        
        // Score and Recommendation
        html += `<div class="detail-section">
            <h4><i class="fas fa-star"></i> Score & Recommendation</h4>
            <div class="detail-field"><strong>Overall Score:</strong> ${feedback.score}/10</div>
            <div class="detail-field"><strong>Recommendation:</strong> ${feedback.recommendation || 'N/A'}</div>
        </div>`;
        
        // Strengths
        if (feedback.strengths) {
            html += `<div class="detail-section">
                <h4><i class="fas fa-thumbs-up"></i> Strengths</h4>
                <div style="background: #e8f5e9; padding: 0.8rem; border-radius: 0.5rem; white-space: pre-wrap;">${escapeHtml(feedback.strengths)}</div>
            </div>`;
        }
        
        // Weaknesses
        if (feedback.weaknesses) {
            html += `<div class="detail-section">
                <h4><i class="fas fa-thumbs-down"></i> Areas for Improvement</h4>
                <div style="background: #fff3e0; padding: 0.8rem; border-radius: 0.5rem; white-space: pre-wrap;">${escapeHtml(feedback.weaknesses)}</div>
            </div>`;
        }
        
        // Comments
        if (feedback.comments) {
            html += `<div class="detail-section">
                <h4><i class="fas fa-comment-dots"></i> Detailed Comments</h4>
                <div style="background: #f8f9fa; padding: 0.8rem; border-radius: 0.5rem; white-space: pre-wrap;">${escapeHtml(feedback.comments)}</div>
            </div>`;
        }
        
        // Admin Notes (only visible to admin)
        if (feedback.adminNotes) {
            html += `<div class="detail-section" style="background: #fff9e6;">
                <h4><i class="fas fa-lock"></i> Confidential Notes to Admin</h4>
                <div style="padding: 0.8rem; border-radius: 0.5rem; white-space: pre-wrap;">${escapeHtml(feedback.adminNotes)}</div>
                <small><i class="fas fa-info-circle"></i> These notes are only visible to administrators.</small>
            </div>`;
        }
    }
    
    html += `</div>`;
    
    Swal.fire({
        title: title,
        html: html,
        width: '800px',
        confirmButtonColor: '#D4AF37',
        confirmButtonText: 'Close'
    });
}

function editApplicationStatus(appId) {
    let foundEmail = null, foundApp = null, foundIndex = null;
    for (let email in submissionsDB) {
        let apps = submissionsDB[email];
        if (Array.isArray(apps)) {
            for (let i = 0; i < apps.length; i++) {
                if (apps[i].id === appId) { foundEmail = email; foundApp = apps[i]; foundIndex = i; break; }
            }
        }
        if (foundApp) break;
    }
    if (!foundApp) { Swal.fire({ icon: 'error', title: 'Error', text: 'Application not found!' }); return; }
    
    Swal.fire({
        title: 'Update Application Status',
        html: `<select id="newStatus" style="width:100%; padding:0.5rem; border-radius:0.5rem;">
            <option value="Awaiting Signatures" ${foundApp.status === 'Awaiting Signatures' ? 'selected' : ''}>Awaiting Signatures</option>
            <option value="Under Review" ${foundApp.status === 'Under Review' ? 'selected' : ''}>Under Review</option>
            <option value="External Review" ${foundApp.status === 'External Review' ? 'selected' : ''}>External Review</option>
            <option value="Approved" ${foundApp.status === 'Approved' ? 'selected' : ''}>Approved</option>
        </select>`,
        showCancelButton: true, confirmButtonColor: '#D4AF37', confirmButtonText: 'Update',
        preConfirm: () => {
            const newStatus = document.getElementById('newStatus').value;
            const oldStatus = foundApp.status;
            submissionsDB[foundEmail][foundIndex].status = newStatus;
            saveToLocalStorage();
            
            // Notify faculty about status change
            let icon = '📋', color = '#3498db';
            if (newStatus === 'Approved') { icon = '✅'; color = '#2ecc71'; }
            else if (newStatus === 'Under Review') { icon = '🔍'; color = '#f39c12'; }
            
            addNotification(foundEmail, 'status_change', `📋 Application Status Updated`, `Your application status has changed from "${oldStatus}" to "${newStatus}".`, appId, icon, color);
            
            renderDashboard();
            Swal.fire({ icon: 'success', title: 'Updated!', text: 'Application status updated and faculty notified.', confirmButtonColor: '#D4AF37', timer: 1500, showConfirmButton: false });
        }
    });
}

function deleteApplication(appId) {
    Swal.fire({ title: 'Delete Application?', text: 'This cannot be undone!', icon: 'warning', showCancelButton: true, confirmButtonColor: '#e74c3c', confirmButtonText: 'Yes, delete' }).then((result) => {
        if (result.isConfirmed) {
            for (let email in submissionsDB) {
                let apps = submissionsDB[email];
                if (Array.isArray(apps)) {
                    let newApps = apps.filter(a => a.id !== appId);
                    if (newApps.length !== apps.length) {
                        submissionsDB[email] = newApps;
                        saveToLocalStorage();
                        renderDashboard();
                        Swal.fire({ icon: 'success', title: 'Deleted!', text: 'Application has been deleted.', confirmButtonColor: '#D4AF37' });
                        return;
                    }
                }
            }
        }
    });
}
